syntax = "proto3";
// file: embodied/logging/SystemMetrics.proto  package: embodied.logging
package embodied.logging;
message SystemState {
  optional uint64 timestamp = 1;
  optional float CPULoad = 2;
  optional uint32 RAMFree = 3;
  optional float DiskFree = 4;
  optional uint64 Uptime = 5;
  optional uint32 Temperature = 6;
  optional uint32 Battery = 7;
  optional int32 WifiRssi = 8;
  optional string software_version = 100;
  optional string module_name = 101;
}
