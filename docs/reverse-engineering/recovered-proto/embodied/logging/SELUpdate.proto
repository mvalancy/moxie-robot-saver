syntax = "proto3";
// file: embodied/logging/SELUpdate.proto  package: embodied.logging
package embodied.logging;
message SELUpdate {
  optional string goal_uuid = 1;
  optional string level_uuid = 2;
  optional uint64 timestamp = 3;
  optional string module_id = 4;
  optional string software_version = 100;
  optional string module_name = 101;
}
message SELUpdateSet {
  repeated embodied.logging.SELUpdate sel_updates = 1;
}
