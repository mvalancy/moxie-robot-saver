  optional float end_timestamp_float = 8;
  optional float confidence = 9;
  optional double last_time_in_view_double = 10;
  optional double last_time_heard_double = 11;
  optional uint64 begin_timestamp = 12;
  optional uint64 end_timestamp = 13;
  optional uint64 last_time_in_view = 14;
  optional uint64 last_time_heard = 15;
  optional string stt_event_id = 16;
  optional float doa_confidence = 17;
  repeated string alternate_utterances = 18;
  optional string language = 19;
  optional string original_language = 20;
  optional string original_utterance = 21;
  repeated string original_alternate_utterances = 22;
}
