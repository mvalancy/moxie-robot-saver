  optional uint64 timestamp = 11;
  optional float confidence = 12;
  optional float world_x = 13;
  optional float world_y = 14;
  optional float world_z = 15;
  optional float world_width = 16;
  optional float world_height = 17;
  optional bool vad_speaking = 18;
  optional uint64 started_speaking = 29;
}
message FusedFacePB {
  optional float world_x = 1;
  optional float world_y = 2;
  optional float world_z = 3;
  optional float world_width = 4;
  optional float world_height = 5;
  optional float screen_x = 6;
  optional float screen_y = 7;
  optional float screen_width = 8;
  optional float screen_height = 9;
  optional float roll = 10;
