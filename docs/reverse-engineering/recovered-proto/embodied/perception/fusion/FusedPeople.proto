syntax = "proto3";
// file: embodied/perception/fusion/FusedPeople.proto  package: embodied.perception.fusion
package embodied.perception.fusion;
enum FusedPersonSpeakingSource {
  UNKNOWN = 0;
  STT = 1;
  VAD = 2;
}
message FusedPeoplePB {
  optional double timestamp_double = 1;
  repeated embodied.perception.fusion.FusedPersonPB people = 2;
  optional uint64 timestamp = 3;
  optional string software_version = 100;
  optional string module_name = 101;
}
