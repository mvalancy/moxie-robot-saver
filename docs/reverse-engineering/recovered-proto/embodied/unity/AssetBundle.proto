syntax = "proto3";
// file: embodied/unity/AssetBundle.proto  package: embodied.unity
package embodied.unity;
message AssetBundleCache {
  optional uint64 timestamp = 1;
  repeated string bundles = 2;
  optional string software_version = 100;
  optional string module_name = 101;
}
message AssetBundleScan {
  optional uint64 timestamp = 1;
  optional string software_version = 100;
  optional string module_name = 101;
}
message AssetBundleRelease {
  optional uint64 timestamp = 1;
  repeated string bundles = 2;
  optional string software_version = 100;
  optional string module_name = 101;
}
message AssetBundleReload {
  optional uint64 timestamp = 1;
  repeated string bundles = 2;
  optional string software_version = 100;
  optional string module_name = 101;
}
