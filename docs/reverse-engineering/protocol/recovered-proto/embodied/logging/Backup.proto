syntax = "proto3";
// file: embodied/logging/Backup.proto  package: embodied.logging
package embodied.logging;
message BackupStageRequest {
  optional uint64 timestamp = 1;
  optional string path = 2;
  optional uint64 end_timestamp = 3;
  optional string software_version = 100;
  optional string module_name = 101;
}
message BackupDataUpdate {
  optional uint64 timestamp = 1;
  optional string actor = 2;
  optional bool complete = 3;
  optional uint64 extend_timestamp = 4;
  repeated string files_added = 5;
  optional string software_version = 100;
  optional string module_name = 101;
}
