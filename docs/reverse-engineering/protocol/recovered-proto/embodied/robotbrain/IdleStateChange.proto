syntax = "proto3";
// file: embodied/robotbrain/IdleStateChange.proto  package: embodied.robotbrain
package embodied.robotbrain;
message IdleStateChange {
  optional string state = 1;
  optional string user = 2;
  optional string bot = 3;
  optional uint64 timestamp = 4;
  optional string software_version = 100;
  optional string module_name = 101;
}
