syntax = "proto3";
// file: embodied/robotbrain/Fallback.proto  package: embodied.robotbrain
package embodied.robotbrain;
message Fallback {
  optional string topic = 1;
  optional string module = 2;
  optional string userInput = 3;
  optional uint64 timestamp = 4;
  optional string fallbackType = 5;
  optional string software_version = 100;
  optional string module_name = 101;
}
