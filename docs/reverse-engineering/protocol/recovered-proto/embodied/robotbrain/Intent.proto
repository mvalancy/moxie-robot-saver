syntax = "proto3";
// file: embodied/robotbrain/Intent.proto  package: embodied.robotbrain
package embodied.robotbrain;
message IntentPB {
  optional string intent = 1;
  optional string input = 2;
  optional uint64 timestamp = 3;
  optional string software_version = 100;
  optional string module_name = 101;
}
