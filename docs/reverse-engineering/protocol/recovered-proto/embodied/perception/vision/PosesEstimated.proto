syntax = "proto3";
// file: embodied/perception/vision/PosesEstimated.proto  package: embodied.perception.vision
package embodied.perception.vision;
message jointPosPB {
  optional uint64 index = 1;
  optional float x = 2;
  optional float y = 3;
}
message PosePB {
  repeated embodied.perception.vision.jointPosPB joints = 1;
  optional uint64 class_id = 2;
  optional uint64 new_pose_id = 3;
  optional float proba = 4;
}
message PosesEstimatedPB {
  optional uint64 frame_id = 1;
  optional double timestamp_deprecated = 2;
  repeated embodied.perception.vision.PosePB people = 3;
  optional uint64 timestamp = 4;
  optional string software_version = 100;
  optional string module_name = 101;
}
