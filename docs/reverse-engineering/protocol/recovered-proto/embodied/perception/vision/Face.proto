syntax = "proto3";
// file: embodied/perception/vision/Face.proto  package: embodied.perception.vision
package embodied.perception.vision;
message Face {
  optional float centre_x = 1;
  optional float centre_y = 2;
  optional float centre_z = 3;
  optional float pose_r = 4;
  optional float pose_p = 5;
  optional float pose_y = 6;
  optional float distance = 7;
  optional string id = 8;
  optional uint64 emotion = 9;
  optional float emotion_proba = 10;
  optional uint64 action_unit = 11;
  optional float action_unit_proba = 12;
  optional uint64 timestamp = 13;
  optional string gesture = 14;
  optional string software_version = 100;
  optional string module_name = 101;
}
