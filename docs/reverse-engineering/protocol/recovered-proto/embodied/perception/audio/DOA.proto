syntax = "proto3";
// file: embodied/perception/audio/DOA.proto  package: embodied.perception.audio
package embodied.perception.audio;
message DOA {
  optional uint64 timestamp = 1;
  optional int32 doa = 2;
  optional int32 vad = 3;
  optional uint64 doa_timestamp = 4;
  optional int32 doa_ready = 5;
  optional string software_version = 100;
  optional string module_name = 101;
}
