syntax = "proto3";
// file: embodied/unity/SpeechPlayback.proto  package: embodied.unity
package embodied.unity;
message SpeechPlaybackState {
  optional bool isPlaying = 1;
  optional uint64 timestamp = 2;
  optional string input_id = 3;
  optional string software_version = 100;
  optional string module_name = 101;
}
