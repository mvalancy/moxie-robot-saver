syntax = "proto3";
// file: embodied/perception/vision/FacesRecognized.proto  package: embodied.perception.vision
package embodied.perception.vision;
message RecognizedPersonPB {
  optional float center_x = 1;
  optional float center_y = 2;
  optional float width = 3;
  optional float height = 4;
  optional float confidence = 5;
  optional string name = 6;
  optional float pitch = 7;
  optional float yaw = 8;
  optional float roll = 9;
  optional uint64 emotion = 10;
  optional float emotion_proba = 11;
  optional float left_eye_x = 12;
  optional float left_eye_y = 13;
  optional float right_eye_x = 14;
  optional float right_eye_y = 15;
  optional float occlusion = 16;
  optional string gesture = 17;
}
message FacesRecognizedPB {
  optional uint64 frame_id = 1;
  optional double timestamp_deprecated = 2;
  repeated embodied.perception.vision.RecognizedPersonPB people = 3;
  optional uint64 timestamp = 4;
  optional string software_version = 100;
  optional string module_name = 101;
}
