syntax = "proto3";
// file: embodied/perception/vision/ImageToText.proto  package: embodied.perception.vision
package embodied.perception.vision;
message ImageToTextPB {
  optional string question = 1;
  optional string prompt = 2;
  optional string description = 3;
  optional string session_id = 4;
  optional uint64 timestamp = 5;
  optional uint64 frame_id = 6;
  optional float targeted_width = 7;
  optional float targeted_height = 8;
  optional float targeted_center_x = 9;
  optional float targeted_center_y = 10;
  optional bool is_mentor = 11;
  optional string software_version = 100;
  optional string module_name = 101;
}
