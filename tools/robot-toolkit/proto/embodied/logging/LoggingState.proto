syntax = "proto3";
// file: embodied/logging/LoggingState.proto  package: embodied.logging
package embodied.logging;
import "embodied/logging/enums.proto";
message LoggingStateChangeRequest {
  optional embodied.logging.LoggingState state = 1;
  optional string path = 2;
  optional uint64 timestamp = 3;
  optional string software_version = 100;
  optional string module_name = 101;
}
message LoggingStateUpdate {
  optional embodied.logging.LoggingState state = 1;
  optional string path = 2;
  optional string uuid = 3;
  optional uint64 timestamp = 4;
  optional string user_uuid = 5;
  optional string session_uuid = 6;
  optional embodied.logging.LoggingPolicy upload_policy = 7;
  optional string software_version = 100;
  optional string module_name = 101;
}
