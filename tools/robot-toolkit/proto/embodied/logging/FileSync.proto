syntax = "proto3";
// file: embodied/logging/FileSync.proto  package: embodied.logging
package embodied.logging;
message FileEntry {
  optional string path = 1;
  optional string hash = 2;
}
message FileListQuery {
  optional string root_name = 1;
  optional string current_version = 2;
}
message FileListResponse {
  optional string root_name = 1;
  optional string current_version = 2;
  repeated embodied.logging.FileEntry files = 3;
}
message FileRead {
  optional string root_name = 1;
  optional embodied.logging.FileEntry file = 2;
}
message FileResponse {
  optional string root_name = 1;
  optional embodied.logging.FileEntry file = 2;
  optional bytes contents = 3;
}
message FileSyncState {
  enum SyncState {
    SYNC_IDLE = 0;
    SYNC_ACTIVE = 1;
    SYNC_COMPLETE = 2;
  }
  enum RootType {
    ROOT_TYPE_UNKNOWN = 0;
    ASSETS = 1;
  }
  optional uint64 timestamp = 1;
  optional string root_name = 2;
  optional string local_path = 3;
  optional embodied.logging.FileSyncState.SyncState sync_state = 4;
  optional embodied.logging.FileSyncState.RootType root_type = 5;
  optional string software_version = 100;
  optional string module_name = 101;
}
