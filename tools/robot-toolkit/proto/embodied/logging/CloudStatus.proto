syntax = "proto3";
// file: embodied/logging/CloudStatus.proto  package: embodied.logging
package embodied.logging;
import "embodied/logging/enums.proto";
message CloudStatusRequest {
  optional uint64 timestamp = 1;
  optional string software_version = 100;
  optional string module_name = 101;
}
message CloudStatus {
  enum UserState {
    UNKNOWN = 0;
    NONE = 1;
    PAIRED_PENDING = 2;
    PAIRED_VALID = 3;
    UNPAIR_REQUESTED = 4;
    OTA_LOCK = 5;
    UNPAIR_WITH_RFS = 6;
    USER_DATA_UPDATE = 7;
  }
  optional uint64 timestamp = 1;
  optional bool connected = 2;
  optional uint32 user_state = 3;
  optional embodied.logging.IOTEndpoint endpoint = 4;
  optional string software_version = 100;
  optional string module_name = 101;
}
