# 🤖 The Moxie stack from PUBLISHED images — no clone, no build, two commands.
#
#     curl -O https://raw.githubusercontent.com/mvalancy/moxie-robot-saver/main/docker-compose.images.yml
#     docker compose -f docker-compose.images.yml up
#
# This file is SELF-CONTAINED on purpose: it references no other file in the repo, so an
# owner who downloads only this (plus an optional .env) gets the whole appliance. Every
# service either uses an upstream image or one of ours from GHCR:
#
#   certs       ghcr.io/mvalancy/moxie-robot-saver/broker-certs   (mqtt/broker/Dockerfile)
#   broker      eclipse-mosquitto:2.0.20 + the config inlined below
#   supervisor  ghcr.io/mvalancy/moxie-robot-saver/supervisor     (mqtt/Dockerfile)
#   console     ghcr.io/mvalancy/moxie-robot-saver/console        (server/Dockerfile)
#
# Images are multi-arch (linux/amd64 + linux/arm64) and published by the release
# workflow on every `v*` tag — see RELEASING.md. Pin a version with MOXIE_IMAGE_TAG.
#
# Building from a clone instead? That is the sibling `docker-compose.yml`, which is
# unchanged and still the path for the `voice` / `stt` profiles (they bake extra wheels
# into the supervisor IMAGE, so a prebuilt one cannot enable them).
#
# Guide: docs/guides/one-command-stack.md
# (Install-UX cross-checked against OpenMoxie's prebuilt-image compose (MIT): one
#  downloadable file, one .env, named volumes. No code taken; this is our own.)
#
# Same project name as docker-compose.yml, so both paths share the SAME named volumes
# (moxie_moxie-certs, moxie_moxie-console-data, …) and you can switch between them
# without losing your certs, your DB or Moxie's memory.
name: moxie

# The broker's config AND its two ACL files, inlined so this file needs nothing beside
# it. Byte-for-byte the repo's mqtt/broker/{compose-mosquitto.conf,acl,acl-robot}, except
# `$` doubled for compose (the guards in sim/run_compose_smoke.sh and
# sim/tests/test_compose.py fail if any of the three ever drifts).
configs:
  mosquitto-conf:
    content: |
      # Broker config for the ONE-COMMAND STACK (the repo-root docker-compose.yml).
      #
      # Same trust model as mosquitto.conf (LAN-only, anonymous for the robot, TLS on 8883),
      # hardened by security-broker-auth.md §2 (P0): every anonymous client is confined to its
      # own device subtree by a `%c` ACL, and the supervisor authenticates with a per-appliance
      # credential the `certs` one-shot mints into the shared volume. **P0 is containment, not
      # authentication** — a spoofed `d_<uuid>` is still served as that robot; the pairing gate
      # is what decides whether it is served anything real.
      #
      # 8883 = the robot (TLS) · 1883 = supervisor/SIM/tests · 9001 = the browser UI over WS.

      # Security is PER LISTENER, and it has to be: a real robot presents an RS256 JWT as its
      # MQTT password (cloud-protocol.md E3/E4), so a `password_file` on 8883 would refuse the
      # robot this appliance exists for. The supervisor's credential therefore lives only on
      # the listeners the supervisor and the console use.
      per_listener_settings true

      listener 8883
      cafile   /mosquitto/config/keys/ca.crt
      certfile /mosquitto/config/keys/mosquitto.crt
      keyfile  /mosquitto/config/keys/mosquitto.key
      tls_version tlsv1.2
      allow_anonymous true
      acl_file /mosquitto/config/acl-robot

      # The plain listener binds every *container* interface, because in compose the supervisor
      # is a different container. The compose network is the boundary; on the HOST this port is
      # published to 127.0.0.1 by default (MOXIE_BIND_HOST_PLAIN).
      listener 1883
      allow_anonymous true
      password_file /mosquitto/config/keys/passwd
      acl_file /mosquitto/config/acl

      listener 9001
      protocol websockets
      allow_anonymous true
      password_file /mosquitto/config/keys/passwd
      acl_file /mosquitto/config/acl

      # The supervisor detects robot connect/disconnect by watching $$SYS/broker/log, so the
      # broker must republish its log to that topic (see supervisor/moxie_runtime.py).
      log_dest stdout
      log_dest topic
      log_type all
      connection_messages true
      sys_interval 10

      persistence true
      persistence_location /mosquitto/data/
  # The %c ACLs, inlined for the same reason (security-broker-auth.md §2.1). Two files
  # because the robot listener cannot carry a password_file, and a `user` block on a
  # listener without one matches an unverified username.
  mosquitto-acl:
    content: |
      # ACL for the CONSOLE-SIDE listeners — plain 1883 and websockets 9001.
      # Ships with docs/architecture/backlog/security-broker-auth.md §2.1 (P0).
      #
      # READ THIS FIRST: **P0 is containment, not authentication.** Nothing here checks that a
      # client calling itself `d_1234…` is that robot. What it does is confine every anonymous
      # client to its own device subtree, so a spoofed or hostile client on the LAN can no
      # longer enumerate the fleet from $$SYS or read another child's config.
      #
      # `%c` substitutes the CLIENT ID, which every client has whether or not it authenticates
      # — that is the whole reason a per-device confinement is available before device auth is.
      # There is deliberately NO bare `topic` grant for the robot subtree: an anonymous client
      # gets nothing but the patterns below.
      #
      # Loaded ONLY by listeners that also load `password_file` (see compose-mosquitto.conf).
      # A `user` block matches on a username the broker did not verify when no password file is
      # configured for that listener — so a listener without one gets `acl-robot` instead.

      pattern write /devices/%c/events/#
      pattern write /devices/%c/state
      pattern read  /devices/%c/config
      pattern read  /devices/%c/commands/#

      # The browser SIM (sim/web/bridge.js) is a console-side OBSERVER as much as a robot
      # double: it renders whichever robot is talking, so it subscribes `/devices/+/…`. A page
      # served to a browser cannot hold a secret, so this grant is anonymous and read-only, and
      # it is why 9001 stays the appliance's one LAN-visible bus door. It writes as the fixed
      # SIM device id `d_sim` and never as a real robot.
      topic read  /devices/#
      topic write /devices/d_sim/events/#
      topic write /devices/d_sim/state

      # The supervisor is the one fleet-wide identity, and it must authenticate to get here:
      # the per-appliance credential the `certs` one-shot mints (§2.2). $$SYS is supervisor-only
      # because $$SYS/broker/log is where every `d_<uuid>` on the appliance is announced.
      user supervisor
      topic readwrite /devices/#
      topic read      $$SYS/#
  mosquitto-acl-robot:
    content: |
      # ACL for the ROBOT listener — TLS 8883.
      # Ships with docs/architecture/backlog/security-broker-auth.md §2.1 (P0).
      #
      # Same `%c` floor as `acl`, and NOTHING else. Two things are deliberately absent:
      #
      #   * no `user` block. A real robot presents an RS256 JWT as its MQTT password and an
      #     unspecified username (cloud-protocol.md E3/E4), so this listener cannot carry a
      #     `password_file` without refusing the robot it exists for. On a listener with no
      #     password file mosquitto accepts ANY username unchecked — a `user supervisor` block
      #     here would hand the fleet to anyone who typed the word. Verified against
      #     eclipse-mosquitto 2.0.20 before this file was written.
      #   * no fleet-wide `topic read`. This is the listener a real robot connects on, so the
      #     cross-device read this closes is one child's `child_pii` reaching another's robot.
      #
      # **P0 is containment, not authentication.** A spoofed `d_<uuid>` is confined to that
      # robot's subtree — which is the subtree it wanted. Refusing the CONNECT is P2.

      pattern write /devices/%c/events/#
      pattern write /devices/%c/state
      pattern read  /devices/%c/config
      pattern read  /devices/%c/commands/#
services:

  # ── one-shot: the broker's TLS material ────────────────────────────────────────────
  certs:
    image: ${MOXIE_IMAGE_REGISTRY:-ghcr.io/mvalancy/moxie-robot-saver}/broker-certs:${MOXIE_IMAGE_TAG:-latest}
    pull_policy: ${MOXIE_IMAGE_PULL_POLICY:-missing}
    environment:
      MOXIE_BROKER_HOST: ${MOXIE_BROKER_HOST:-127.0.0.1}   # LAN IP a robot uses → cert SAN
    volumes:
      - moxie-certs:/certs
    restart: "no"

  # ── the MQTT broker the robot (or the SIM) connects to ────────────────────────────
  broker:
    image: eclipse-mosquitto:2.0.20
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "${MOXIE_BIND_HOST:-0.0.0.0}:${MOXIE_PORT_MQTT_TLS:-8883}:8883"   # robot (TLS)
      # The plain listener is LOOPBACK-ONLY by default (security-broker-auth.md §2.4):
      # it is the one door with a fleet-wide identity behind it. Set
      # MOXIE_BIND_HOST_PLAIN=0.0.0.0 to drive it from another machine.
      - "${MOXIE_BIND_HOST_PLAIN:-127.0.0.1}:${MOXIE_PORT_MQTT:-1883}:1883"   # SIM / tests
      - "${MOXIE_BIND_HOST:-0.0.0.0}:${MOXIE_PORT_WS:-9001}:9001"         # browser UI (MQTT over WS)
    configs:
      - source: mosquitto-conf
        target: /mosquitto/config/mosquitto.conf
      - source: mosquitto-acl
        target: /mosquitto/config/acl
      - source: mosquitto-acl-robot
        target: /mosquitto/config/acl-robot
    volumes:
      - moxie-certs:/mosquitto/config/keys:ro   # + the minted `passwd` (§2.2)
      - moxie-broker-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -m up -q 0"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # ── the robot cloud: protocol + config + brain + voice ────────────────────────────
  supervisor:
    image: ${MOXIE_IMAGE_REGISTRY:-ghcr.io/mvalancy/moxie-robot-saver}/supervisor:${MOXIE_IMAGE_TAG:-latest}
    pull_policy: ${MOXIE_IMAGE_PULL_POLICY:-missing}
    depends_on:
      broker:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      MOXIE_ALLOW_UNVERIFIED_BOTS: ${MOXIE_ALLOW_UNVERIFIED_BOTS:-}
      MOXIE_MQTT_HOST: broker
      MOXIE_MQTT_PORT: "1883"
      # The supervisor's broker credential (security-broker-auth.md §2.2). The password
      # is handed over as a FILE, never as a value here: an `environment:` literal shows
      # up in `docker inspect`. The `certs` one-shot mints both into moxie-certs.
      MOXIE_MQTT_USER: ${MOXIE_MQTT_USER:-supervisor}
      MOXIE_MQTT_PASSWORD_FILE: ${MOXIE_MQTT_PASSWORD_FILE:-/certs/supervisor.pass}
      MOXIE_STATUS_PORT: "8930"
      MOXIE_STATUS_PROXY_PORT: "8931"        # deploy-layer shim → the console can read /status
      MOXIE_DATA_DIR: /data                  # the moxie-supervisor-data volume
      MOXIE_MEMORY_DIR: /data/memory         # conversation memory, survives restarts
      MOXIE_APP: ${MOXIE_APP:-content}       # content | llm | echo | webhook
      MOXIE_CONTENT_MODULE: ${MOXIE_CONTENT_MODULE:-content_modules/starter.json}
      MOXIE_CHILD_NICKNAME: ${MOXIE_CHILD_NICKNAME:-friend}
      MOXIE_TTS: ${MOXIE_TTS:-tone}          # tone = the built-in zero-dependency voice
      MOXIE_TTS_VOICE: ${MOXIE_TTS_VOICE:-}   # empty = derived from the model name
      MOXIE_PIPER_MODEL: ${MOXIE_PIPER_MODEL:-}      # published images ship no Piper — see the guide
      MOXIE_PIPER_CONFIG: ${MOXIE_PIPER_CONFIG:-}
      MOXIE_STT: ${MOXIE_STT:-auto}          # auto = gateway ears when a voice/STT URL + key are set, else local whisper if installed, else off
      MOXIE_STT_MODEL: ${MOXIE_STT_MODEL:-}    # unset = per-engine default (stt-whisper on the gateway, base.en locally)
      MOXIE_STT_BASE_URL: ${MOXIE_STT_BASE_URL:-}   # falls back to MOXIE_VOICE_BASE_URL, then the LLM base URL
      MOXIE_STT_API_KEY: ${MOXIE_STT_API_KEY:-}     # falls back to the voice key, then the LLM key
      MOXIE_LLM_BASE_URL: ${MOXIE_LLM_BASE_URL:-https://gateway.graphlings.net/v1}
      MOXIE_LLM_API_KEY: ${MOXIE_LLM_API_KEY:-}
      MOXIE_LLM_MODEL: ${MOXIE_LLM_MODEL:-graphling-medium}
      MOXIE_BRAIN_BUDGET_S: ${MOXIE_BRAIN_BUDGET_S:-6}   # slow brain → a filler line, then the answer
      MOXIE_STREAMING: ${MOXIE_STREAMING:-1}             # speak each sentence as the model writes it
      # The gateway voice: setting the base URL is the whole switch (same key as chat).
      # Piper — or the tone — stays behind it as the standby, so a gateway hiccup
      # downgrades the voice instead of silencing the turn. docs/guides/litellm-tts-setup.md
      MOXIE_VOICE_BASE_URL: ${MOXIE_VOICE_BASE_URL:-}
      MOXIE_VOICE_DISCOVERY_TTL_S: ${MOXIE_VOICE_DISCOVERY_TTL_S:-300}   # how long the console picker caches the gateway's model list
      MOXIE_VOICE_API_KEY: ${MOXIE_VOICE_API_KEY:-}
      MOXIE_VOICE_MODEL: ${MOXIE_VOICE_MODEL:-piper-amy}     # the model IS the voice (piper-amy | piper-ryan)
      MOXIE_VOICE_FORMAT: ${MOXIE_VOICE_FORMAT:-wav}         # wav carries its own sample rate | pcm
      MOXIE_VOICE_SAMPLE_RATE: ${MOXIE_VOICE_SAMPLE_RATE:-22050}   # pcm only
      MOXIE_WEBHOOK_ENDPOINT: ${MOXIE_WEBHOOK_ENDPOINT:-}
      MOXIE_BROKER_HOST: ${MOXIE_BROKER_HOST:-127.0.0.1}
      MOXIE_BROKER_PORT: ${MOXIE_PORT_MQTT_TLS:-8883}
      HF_HOME: /cache/huggingface
    ports:
      # The runtime's own status server stays loopback-only inside the container; this
      # publishes the proxy. Bind it to 127.0.0.1 unless you trust the network.
      - "${MOXIE_BIND_HOST:-127.0.0.1}:${MOXIE_PORT_STATUS:-8931}:8931"
    volumes:
      - moxie-supervisor-data:/data          # conversation memory + MOXIE_DATA_DIR
      - moxie-certs:/certs:ro                # supervisor.pass — the broker credential
      - moxie-models:/models:ro              # Piper voices (build-from-clone `voice` profile)
      - moxie-whisper-cache:/cache           # faster-whisper model cache
    restart: unless-stopped

  # ── the parent console: web app + REST API ────────────────────────────────────────
  console:
    image: ${MOXIE_IMAGE_REGISTRY:-ghcr.io/mvalancy/moxie-robot-saver}/console:${MOXIE_IMAGE_TAG:-latest}
    pull_policy: ${MOXIE_IMAGE_PULL_POLICY:-missing}
    depends_on:
      supervisor:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      MOXIE_SUPERVISOR_STATUS: http://supervisor:8931/status
      MOXIE_BROKER_HOST: ${MOXIE_BROKER_HOST:-127.0.0.1}
      MOXIE_DB: /data/moxie.db
    ports:
      - "${MOXIE_BIND_HOST:-0.0.0.0}:${MOXIE_PORT_CONSOLE:-8080}:8080"
    volumes:
      - moxie-console-data:/data             # moxie.db — children, robots, keys
    restart: unless-stopped

volumes:
  moxie-certs:           # broker CA + server cert (regenerate: docker compose down -v)
  moxie-broker-data:     # mosquitto persistence
  moxie-supervisor-data: # conversation memory / MOXIE_DATA_DIR
  moxie-console-data:    # the console's SQLite DB
  moxie-models:          # Piper voices
  moxie-whisper-cache:   # faster-whisper model cache
