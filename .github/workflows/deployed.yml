# Moxie DEPLOYED-ARTIFACT check — INSTALL: copy to .github/workflows/deployed.yml
#
# THE ONLY TIER THAT LOOKS AT A REAL DEPLOYMENT. Everything else in this repo tests a
# local server: `sim/test_mobile_layout.mjs` serves `sim/web` on loopback and maps
# `moxie.hosted.test` to `127.0.0.1`, `sim/test_csp.mjs` parses `sim/web/_headers` and
# replays the policy itself. Until this file, nothing asserted anything about the bytes
# Cloudflare actually serves — and the deployed artifact demonstrably differs from the
# local one, because Pages INJECTS its Web Analytics beacon into every HTML response
# (`<script src="https://static.cloudflareinsights.com/beacon.min.js/…">`, a tag this repo
# does not write and cannot edit). Our first CSP refused it on every production page load.
# See the long note in `sim/web/_headers`, and `sim/check_deployed.mjs`'s header.
#
# ── WHY THIS IS A SCHEDULE AND NOT A MERGE GATE (the judgement, 2026-09-05) ──────────────
#
# Playbook rule 21 — "open a PR and curl its preview" — makes gating each PR on its own
# Pages preview the obvious wiring. It was investigated and REJECTED, on measurements:
#
#   · `gh api repos/<owner>/<repo>/deployments` returns `[]`. The Pages integration here
#     creates NO GitHub Deployment, so `on: deployment_status` — the one event that hands a
#     workflow an authoritative `environment_url` — can never fire for this repo.
#   · The branch alias is not a synchronous fact. `https://feat-<branch>.<project>.pages.dev/sim`
#     answers HTTP 404 (with a 16 KB HTML body) for a branch that has never been built, and
#     serves the PREVIOUS build for one that has. A job running at push time tests either
#     nothing or yesterday's artifact. That is not flaky, it is WRONG, which is worse.
#   · The Pages bot comment DOES carry an SHA-pinned per-deployment URL (measured on PR #162:
#     `Latest commit: 5617aa3` → `https://0721897a.<project>.pages.dev`, the comment edited
#     in place 4m23s after it first appeared). Polling it would work for this repo's own
#     branches and would fail every time for a fork PR (no preview is built for one) and for
#     a plain push to `dev` (no PR, no comment). A gate that is red for every outside
#     contributor is a gate people learn to ignore — which is worse than no gate.
#   · And the beacon half is UNTESTABLE on a preview anyway: measured 2026-09-05,
#     `dev.<project>.pages.dev`, `<project>.pages.dev` and a branch preview all serve 23,425
#     bytes with NO beacon, against 23,792 on the custom domain. The injection belongs to the
#     ZONE, not to the Pages project, and `pages.dev` is not our zone.
#
# So the wiring is split, and neither half gates a merge on an external service:
#
#   · `sim/ci/ci.yml` (fast tier, every push and PR) runs `check_deployed.mjs --selftest` —
#     hermetic, loopback only, and it proves the instrument has teeth: the unmutated tree
#     must pass every clause and three mutated copies must each redden a different one.
#   · THIS FILE runs the real thing against the live deployment, on a schedule and on
#     demand. Production is settled long before the cron fires, so there is no build race to
#     lose; it is the only place the beacon exists; and because it gates nothing, a
#     Cloudflare hiccup reddens a monitor instead of blocking a merge. That is what an
#     external dependency deserves.
#
# NOTE, so nobody is surprised: GitHub runs `schedule` only from the DEFAULT branch, so this
# tier starts firing once it has been promoted there. Until then (and any time after) use the
# dispatch, which also takes an arbitrary URL:
#
#   gh workflow run deployed.yml
#   gh workflow run deployed.yml -f url=https://feat-x.<project>.pages.dev/sim
#
# NO HOSTNAME IS WRITTEN HERE. With no `url` input the checker reads the site's own
# `<link rel="canonical">` out of `sim/web/index.html` — the artifact names its own home, and
# `sim/tests/test_no_deployment_defaults.py`'s rule is honoured rather than dodged.
#
# ── WHAT THE FREE CHECK COULD NOT SEE, AND THE ONE TURN A DAY THAT CAN (2026-10-07) ───────
#
# Measured with the real checker on five fixtures built from the real Pages Functions —
# healthy, a dead brain, lost secrets, the kill switch, no Functions — every one passed all
# 24 checks, and `GET /api/health` was the only request any of them saw. The checker aborts
# every spending route by design, and /api/health reads configuration only, so it answers
# `live` while every turn fails `upstream_down`. Two changes:
#
#   · `check_deployed.mjs` holds the CANONICAL origin to live (data-mode "live", badge MOXIE
#     ONLINE), so lost secrets, the kill switch and missing Functions redden this tier for
#     free. A preview URL is not held to it (previews are keyless by design); the
#     `expect_live` input overrides either way.
#   · the `canary` job spends ONE chat turn a day (`sim/check_live_turn.mjs`: one gateway
#     completion, 3 of the 4,000-unit daily budget, its voice ticket never redeemed). It is
#     the only instrument here that can see a dead brain.
#
# The canary SUPERSEDES, for that one turn, the 2026-09-05 judgement written at the mic input
# below ("a monitor that eats the thing it monitors is not a monitor"): without it every
# monitor stays green with the brain dead, and one turn a day is 0.075% of the daily budget.
# The owner approved exactly that, one paid turn a day. The mic job's own reasoning stands,
# and it stays off the schedule.
name: Deployed site
on:
  # 4× a day at an odd minute, for the same reason the deep tier uses 03:17: GitHub queues
  # the top of the hour. This tier is a monitor — it is meant to notice a regression that
  # reached production between promotions, not to be part of anyone's inner loop.
  #
  # The SECOND line is the canary's, once a day, and nothing else runs on it. Each job keys
  # on the cron that fired it (`github.event.schedule` is that exact string), so the strings
  # in the jobs' `if:` must match these; sim/tests/test_ci_deployed_monitor.py fails if they
  # drift. GitHub delays and sometimes drops scheduled runs under load (the 4×-a-day line
  # fired 2-4 times a day in the month to 2026-10-07), so "daily" means "when GitHub fires it".
  schedule:
    - cron: "23 2,8,14,20 * * *"
    - cron: "41 15 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Deployment to check (blank = the canonical origin in sim/web/index.html, + /sim)"
        type: string
        default: ""
      expect_beacon:
        description: "Require Cloudflare's injected analytics beacon (auto = yes on a custom domain, no on *.pages.dev)"
        type: choice
        options: [auto, "yes", "no"]
        default: auto
      expect_live:
        description: "Require mode live + badge MOXIE ONLINE (auto = yes on the canonical origin only)"
        type: choice
        options: [auto, "yes", "no"]
        default: auto
      # ── THE CANARY: ON BY DEFAULT ON A DISPATCH, ONCE A DAY ON THE SCHEDULE ─────────────
      # One real turn (`sim/check_live_turn.mjs`): one gateway completion, 3 units. Against a
      # keyless preview it spends nothing (the route refuses before any upstream call) and
      # reads red, truthfully: that deployment has no brain.
      canary:
        description: "Spend ONE real chat turn on the deployment (the daily canary; 3 of the 4,000 daily units)"
        type: boolean
        default: true
      # ── THE SPENDING JOB, OFF BY DEFAULT ──────────────────────────────────────────────
      # `sim/check_hosted_mic.mjs` plays a real voice into Chrome's fake microphone and lets
      # the page do what a visitor's press does: one `POST /api/transcribe`, one
      # `POST /api/chat`, one `POST /api/speech` — three gateway calls out of the budget the
      # whole public demo shares. `dry` proves everything up to the money for free (the
      # button, `getUserMedia` on the deployed origin, the encoded WAV, the audio in it) and
      # is the default because it is the right answer almost every time.
      #
      # WHY THIS IS NOT ON THE SCHEDULE ABOVE, which is the judgement worth writing down: the
      # beacon check is FREE, so running it 1,460 times a year costs nothing and catches a
      # regression that reached production between promotions. This one is not free. Four
      # runs a day is ~4,400 transcriptions, chats and syntheses a year, and the failure it
      # would catch — the gateway's ears stopped answering — is already caught, at no cost to
      # this budget, by `sim/tests/test_live_hosted_ears.py` wherever a gateway is
      # configured. A monitor that eats the thing it monitors is not a monitor. (Superseded
      # for ONE chat turn a day by the `canary` job — see the header — and for nothing else.)
      mic:
        description: "Microphone check against the deployment: off / dry (free) / spend (real gateway calls)"
        type: choice
        options: [off, dry, spend]
        default: dry
      mic_budget:
        description: "Ceiling on gateway-backed requests for the microphone check (a healthy turn is 3)"
        type: string
        default: "5"

# Least privilege: this tier reads a public page and nothing else. It needs no repo scope
# beyond the checkout, no secrets, and — deliberately — no Cloudflare account credentials of
# any kind. It could not deploy, roll back or read a variable if it wanted to.
permissions:
  contents: read

jobs:
  deployed:
    name: Deployed composer + beacon (real browser, real deployment)
    # Not on the canary's cron: that run is the canary's alone, so its colour means the brain.
    if: ${{ github.event.schedule != '41 15 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install a browser
        # FIRST, like the fast tier's browser job. Without one `browser_harness.mjs::skipper`
        # would exit 0 with a "skipped — puppeteer not found" line, and a skip nobody can see
        # is not a skip: it is a green badge over an assertion that never fired. That defect
        # is why `skipper()` turns a missing browser into a FAILURE whenever `CI` is set, and
        # GitHub sets `CI` — so this step failing reddens the job loudly rather than quietly
        # deleting it.
        run: npm install --no-save --no-audit --no-fund puppeteer
      - name: The composer is reachable, the injected beacon loads clean, the canonical origin is live
        env:
          # Empty on a schedule (the `inputs` context is empty for a non-dispatch event), and
          # the checker treats an empty string as "not set" — so the schedule resolves the
          # target from the page's own canonical link.
          MOXIE_DEPLOYED_URL: ${{ inputs.url }}
          # auto → "", which is what the checker's own derivation reads as "decide for me".
          MOXIE_EXPECT_BEACON: ${{ inputs.expect_beacon == 'yes' && '1' || (inputs.expect_beacon == 'no' && '0' || '') }}
          # The same: auto → "", which requires LIVE on the canonical origin and nowhere else.
          MOXIE_EXPECT_LIVE: ${{ inputs.expect_live == 'yes' && '1' || (inputs.expect_live == 'no' && '0' || '') }}
        run: node sim/check_deployed.mjs

  # ── A REAL VOICE THROUGH THE DEPLOYED MICROPHONE ────────────────────────────────────────
  # DISPATCH ONLY, and never on the schedule: `inputs` is empty for a `schedule` event, so
  # `inputs.mic` is '' there and this job is skipped without needing an event test. It is a
  # SEPARATE job rather than another step of the one above so that the free beacon monitor is
  # never blocked by, or blamed for, a microphone run — and so the summary says plainly which
  # of the two actually ran.
  #
  # It gates nothing. Nothing depends on it, no branch protection names it, and a red here
  # means "go and look at the live ears", not "do not merge".
  mic:
    name: A real voice through the deployed microphone (fake device, real gateway)
    if: ${{ inputs.mic == 'dry' || inputs.mic == 'spend' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install a browser
        # Same reason as the job above: without one, `browser_harness.mjs::skipper` would
        # exit 0 with a "skipped" line, and a skip nobody can see is a green badge over an
        # assertion that never fired. `skipper()` turns that into a FAILURE whenever `CI` is
        # set, and GitHub sets it — so this step failing reddens the job loudly.
        run: npm install --no-save --no-audit --no-fund puppeteer
      - name: Speak into the hosted microphone
        env:
          MOXIE_DEPLOYED_URL: ${{ inputs.url }}
          MOXIE_MIC_BUDGET: ${{ inputs.mic_budget }}
        # `--dry-run` aborts every spending route at the browser and still proves the button,
        # the permission grant, the encoded WAV and that the audio in it is the audio played.
        # Without the flag the same run lets the three requests through and additionally
        # asserts that the transcript RESEMBLES the words (a recall overlap against the
        # sentence, plus a decoy sentence scored against the same transcript so the floor
        # cannot be met by a route that returns anything at all).
        run: node sim/check_hosted_mic.mjs ${{ inputs.mic == 'dry' && '--dry-run' || '' }}

  # ── ONE REAL TURN WITH THE DEPLOYED BRAIN, ONCE A DAY ─────────────────────────────────────
  # `sim/check_live_turn.mjs`: one `POST /api/chat` ("hi moxie", a browser user agent, the
  # site's own Origin), asserting a LIVE answer — reason null, a non-empty reply, a voice
  # ticket for that line (never redeemed: no TTS is spent) — inside 10 s. At most two POSTs,
  # the second only after a `rate_limited` refusal, which spends nothing upstream.
  #
  # Its own cron and its own job, so a red run in that slot means the BRAIN and the free check
  # is never blamed for it. It needs no browser and holds no secret: the deployment's own key
  # pays for the turn, exactly as for a visitor. Like everything in this file it gates
  # nothing — a red here means "go and look at the live brain", not "do not merge".
  canary:
    name: One real turn with the deployed brain (spends one chat turn)
    if: ${{ github.event.schedule == '41 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.canary) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ask the deployed brain one question
        env:
          # Empty on the schedule, so the canary asks the canonical origin.
          MOXIE_DEPLOYED_URL: ${{ inputs.url }}
        run: node sim/check_live_turn.mjs
