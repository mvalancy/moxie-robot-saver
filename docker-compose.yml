# 🤖 The one-command Moxie stack.
#
#     cp .env.example .env      # optional — every value below has a working default
#     docker compose up         # broker + supervisor + parent console
#
# What comes up:
#   broker      mosquitto — TLS :8883 for a real robot, :1883 for the SIM, :9001 for the browser UI
#   supervisor  mqtt/run.py — speaks Moxie's protocol, pushes config, drives the brain, synthesizes a voice
#   console     server/run.py — the parent web app + REST API (fleet, config, telemetry) on :8080
#   certs       one-shot: generates the broker's self-signed CA + cert on first run, then exits
#
# Optional profiles (best-effort — read docs/guides/one-command-stack.md before using):
#   docker compose --profile voice up     # fetch the offline Piper voice (Amy) into a volume
#   docker compose --profile stt   up     # pre-fetch the faster-whisper speech-to-text model
#
# Guide: docs/guides/one-command-stack.md
# (Install-UX cross-checked against OpenMoxie's docker-compose.yml (MIT) — one root
#  compose file, one .env, named volumes for state. No code taken; this is our own.)
name: moxie

services:

  # ── one-shot: the broker's TLS material ────────────────────────────────────────────
  certs:
    build:
      context: ./mqtt/broker
    image: moxie/certs-init:local
    environment:
      MOXIE_BROKER_HOST: ${MOXIE_BROKER_HOST:-127.0.0.1}   # LAN IP a robot uses → cert SAN
    volumes:
      - moxie-certs:/certs
    restart: "no"

  # ── the MQTT broker the robot (or the SIM) connects to ────────────────────────────
  broker:
    image: eclipse-mosquitto:2.0.20
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "${MOXIE_BIND_HOST:-0.0.0.0}:${MOXIE_PORT_MQTT_TLS:-8883}:8883"   # robot (TLS)
      - "${MOXIE_BIND_HOST:-0.0.0.0}:${MOXIE_PORT_MQTT:-1883}:1883"       # SIM / tests
      - "${MOXIE_BIND_HOST:-0.0.0.0}:${MOXIE_PORT_WS:-9001}:9001"         # browser UI (MQTT over WS)
    volumes:
      - ./mqtt/broker/compose-mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - moxie-certs:/mosquitto/config/keys:ro
      - moxie-broker-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -m up -q 0"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # ── the robot cloud: protocol + config + brain + voice ────────────────────────────
  supervisor:
    build:
      context: ./mqtt
      args:
        # Extra pip packages baked into the image: "piper-tts" for the offline voice,
        # "faster-whisper numpy" for local STT. Empty by default → a small image.
        EXTRAS: ${MOXIE_SUPERVISOR_EXTRAS:-}
    image: moxie/supervisor:local
    depends_on:
      broker:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      MOXIE_MQTT_HOST: broker
      MOXIE_MQTT_PORT: "1883"
      MOXIE_STATUS_PORT: "8930"
      MOXIE_STATUS_PROXY_PORT: "8931"        # deploy-layer shim → the console can read /status
      MOXIE_DATA_DIR: /data                  # the moxie-supervisor-data volume
      MOXIE_MEMORY_DIR: /data/memory         # conversation memory, survives restarts
      MOXIE_APP: ${MOXIE_APP:-content}       # content | llm | echo | webhook
      MOXIE_CONTENT_MODULE: ${MOXIE_CONTENT_MODULE:-content_modules/starter.json}
      MOXIE_CHILD_NICKNAME: ${MOXIE_CHILD_NICKNAME:-friend}
      MOXIE_TTS: ${MOXIE_TTS:-tone}          # tone = the built-in zero-dependency voice
      MOXIE_TTS_VOICE: ${MOXIE_TTS_VOICE:-alloy}
      MOXIE_PIPER_MODEL: ${MOXIE_PIPER_MODEL:-}      # set with --profile voice (see the guide)
      MOXIE_PIPER_CONFIG: ${MOXIE_PIPER_CONFIG:-}
      MOXIE_STT: ${MOXIE_STT:-auto}          # auto = on when faster-whisper is installed
      MOXIE_STT_MODEL: ${MOXIE_STT_MODEL:-base.en}
      MOXIE_LLM_BASE_URL: ${MOXIE_LLM_BASE_URL:-https://gateway.graphlings.net/v1}
      MOXIE_LLM_API_KEY: ${MOXIE_LLM_API_KEY:-}
      MOXIE_LLM_MODEL: ${MOXIE_LLM_MODEL:-graphling-medium}
      MOXIE_BRAIN_BUDGET_S: ${MOXIE_BRAIN_BUDGET_S:-6}   # slow brain → a filler line, then the answer
      MOXIE_STREAMING: ${MOXIE_STREAMING:-1}             # speak each sentence as the model writes it
      # Device allowlist (pairing gate). Empty = CLOSED: a robot that connects is
      # "pending" and gets a minimal config with no child data until a parent permits it
      # in the console. Set to 1 to serve any robot that connects (pre-gate behavior).
      MOXIE_ALLOW_UNVERIFIED_BOTS: ${MOXIE_ALLOW_UNVERIFIED_BOTS:-}
      MOXIE_VOICE_BASE_URL: ${MOXIE_VOICE_BASE_URL:-}
      MOXIE_VOICE_API_KEY: ${MOXIE_VOICE_API_KEY:-}
      MOXIE_WEBHOOK_ENDPOINT: ${MOXIE_WEBHOOK_ENDPOINT:-}
      MOXIE_BROKER_HOST: ${MOXIE_BROKER_HOST:-127.0.0.1}
      MOXIE_BROKER_PORT: ${MOXIE_PORT_MQTT_TLS:-8883}
      HF_HOME: /cache/huggingface
    ports:
      # The runtime's own status server stays loopback-only inside the container; this
      # publishes the proxy. Bind it to 127.0.0.1 unless you trust the network.
      - "${MOXIE_BIND_HOST:-127.0.0.1}:${MOXIE_PORT_STATUS:-8931}:8931"
    volumes:
      - moxie-supervisor-data:/data          # conversation memory + MOXIE_DATA_DIR
      - moxie-models:/models:ro              # Piper voices (--profile voice)
      - moxie-whisper-cache:/cache           # faster-whisper model cache (--profile stt)
    restart: unless-stopped

  # ── the parent console: web app + REST API ────────────────────────────────────────
  console:
    build:
      context: .                     # the console also ships tools/pairing (moxie_qr)
      dockerfile: server/Dockerfile
    image: moxie/console:local
    depends_on:
      supervisor:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      MOXIE_SUPERVISOR_STATUS: http://supervisor:8931/status
      MOXIE_BROKER_HOST: ${MOXIE_BROKER_HOST:-127.0.0.1}
      MOXIE_DB: /data/moxie.db
    ports:
      - "${MOXIE_BIND_HOST:-0.0.0.0}:${MOXIE_PORT_CONSOLE:-8080}:8080"
    volumes:
      - moxie-console-data:/data             # moxie.db — children, robots, keys
    restart: unless-stopped

  # ── profile: voice — fetch the offline Piper voice (Amy) into moxie-models ────────
  # Best-effort. Giving the supervisor a real voice also needs the Piper runtime in its
  # image: set MOXIE_SUPERVISOR_EXTRAS=piper-tts and MOXIE_PIPER_MODEL in .env, then
  # `docker compose --profile voice up --build`. See docs/guides/one-command-stack.md.
  voice-model:
    profiles: ["voice"]
    image: alpine:3.20
    environment:
      MOXIE_PIPER_VOICE_URL: ${MOXIE_PIPER_VOICE_URL:-https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx}
    volumes:
      - moxie-models:/models
    command:
      - sh
      - -c
      - |
        set -e
        f=/models/$$(basename "$$MOXIE_PIPER_VOICE_URL")
        if [ -s "$$f" ]; then echo "[voice] $$f already present"; exit 0; fi
        apk add --no-cache wget ca-certificates >/dev/null
        echo "[voice] downloading $$MOXIE_PIPER_VOICE_URL"
        wget -q -O "$$f" "$$MOXIE_PIPER_VOICE_URL"
        wget -q -O "$$f.json" "$$MOXIE_PIPER_VOICE_URL.json"
        chmod 0644 "$$f" "$$f.json"
        echo "[voice] ready: $$f  → set MOXIE_PIPER_MODEL=$$f in .env"
    restart: "no"

  # ── profile: stt — pre-fetch the faster-whisper model into moxie-whisper-cache ────
  # Best-effort, and it builds a second (large) image. Giving the supervisor ears also
  # needs MOXIE_SUPERVISOR_EXTRAS="faster-whisper numpy" + `up --build`.
  stt-model:
    profiles: ["stt"]
    build:
      context: ./mqtt
      args:
        EXTRAS: "faster-whisper numpy"
    image: moxie/supervisor-stt:local
    environment:
      MOXIE_STT_MODEL: ${MOXIE_STT_MODEL:-base.en}
      HF_HOME: /cache/huggingface
    volumes:
      - moxie-whisper-cache:/cache
    command:
      - python
      - -c
      - |
        import os
        from faster_whisper import WhisperModel
        m = os.environ.get("MOXIE_STT_MODEL", "base.en")
        print(f"[stt] fetching faster-whisper model {m} into {os.environ.get('HF_HOME')}")
        WhisperModel(m, device="cpu", compute_type="int8")
        print("[stt] ready")
    restart: "no"

volumes:
  moxie-certs:           # broker CA + server cert (regenerate: docker compose down -v)
  moxie-broker-data:     # mosquitto persistence
  moxie-supervisor-data: # conversation memory / MOXIE_DATA_DIR
  moxie-console-data:    # the console's SQLite DB
  moxie-models:          # Piper voices
  moxie-whisper-cache:   # faster-whisper model cache
