<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Moxie Docs — reverse-engineering explorer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --void:#060609; --bg:#0a0a0f; --panel:#101018; --panel2:#0c0c13; --hairline:#2a303c;
    --text:#e8edf5; --text-dim:#c8d0dc; --muted:#8892a4; --dim:#5a6577;
    --cyan:#00f0ff; --cyan-dim:#0e7490; --mint:#05ffa1; --amber:#fcee0a; --magenta:#ff2a6d; --purple:#a855f7;
    --font-ui:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
    --rail:300px;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;
    display:grid;grid-template-columns:var(--rail) 1fr;height:100vh;overflow:hidden}
  /* rail */
  aside{background:linear-gradient(180deg,var(--panel),var(--panel2));border-right:1px solid var(--hairline);
    display:flex;flex-direction:column;min-height:0}
  .railhead{padding:14px 14px 10px;border-bottom:1px solid var(--hairline)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
  .brand small{color:var(--muted);font-weight:400}
  .fw{font-family:var(--font-mono);font-size:10.5px;color:var(--mint);margin-top:6px}
  .nav{display:flex;gap:8px;margin-top:8px;font-size:12px}
  .nav a{color:var(--muted);text-decoration:none}.nav a:hover{color:var(--cyan)}
  #q{width:100%;margin-top:10px;background:var(--void);border:1px solid var(--hairline);color:var(--text);
    border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  #q:focus{outline:none;border-color:var(--cyan-dim)}
  .tree{overflow-y:auto;padding:8px 6px 24px;flex:1;min-height:0}
  .sec{margin:10px 8px 4px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:600}
  a.doc{display:block;padding:5px 10px;border-radius:7px;color:var(--text-dim);text-decoration:none;font-size:13px;
    line-height:1.3;border-left:2px solid transparent}
  a.doc:hover{background:#161c26;color:var(--text)}
  a.doc.active{background:#12202b;border-left-color:var(--cyan);color:var(--cyan)}
  a.doc .m{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-left:4px}
  a.doc.hit em{color:var(--amber);font-style:normal}
  .hidden{display:none!important}
  /* content */
  main{overflow-y:auto;min-height:0}
  .topbar{position:sticky;top:0;z-index:5;background:#0a0a0fcc;backdrop-filter:blur(8px);
    border-bottom:1px solid var(--hairline);padding:9px 26px;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
  .topbar .path{font-family:var(--font-mono);color:var(--text-dim)}
  .topbar .burger{display:none;background:none;border:1px solid var(--hairline);color:var(--muted);
    border-radius:7px;padding:4px 9px;cursor:pointer;font-size:14px}
  .topbar a.src{margin-left:auto;color:var(--cyan-dim);text-decoration:none}
  article{max-width:860px;margin:0 auto;padding:30px 26px 90px;line-height:1.65}
  article h1{font-size:29px;letter-spacing:-.4px;margin:.2em 0 .5em;border-bottom:1px solid var(--hairline);padding-bottom:.3em}
  article h2{font-size:22px;margin:1.5em 0 .5em;border-bottom:1px solid #1a1f28;padding-bottom:.2em}
  article h3{font-size:17px;margin:1.3em 0 .4em}
  article h4{font-size:15px;margin:1.2em 0 .3em;color:var(--text-dim)}
  article p,article li{color:var(--text-dim)}
  article a{color:var(--cyan);text-decoration:none}article a:hover{text-decoration:underline}
  article code{font-family:var(--font-mono);font-size:.88em;background:#12141c;border:1px solid var(--hairline);
    border-radius:5px;padding:.08em .35em;color:var(--mint)}
  article pre{background:#0c0e14;border:1px solid var(--hairline);border-radius:10px;padding:14px 16px;overflow-x:auto}
  article pre code{background:none;border:none;padding:0;color:var(--text-dim);font-size:12.5px;line-height:1.55}
  article table{border-collapse:collapse;width:100%;margin:1em 0;font-size:13.5px;display:block;overflow-x:auto}
  article th,article td{border:1px solid var(--hairline);padding:7px 11px;text-align:left}
  article th{background:#12141c;color:var(--text)}
  article blockquote{border-left:3px solid var(--cyan-dim);margin:1em 0;padding:.3em 1em;background:#0c141a;
    border-radius:0 8px 8px 0;color:var(--muted)}
  article img{max-width:100%}
  article hr{border:none;border-top:1px solid var(--hairline);margin:2em 0}
  .mermaid{background:#0c0e14;border:1px solid var(--hairline);border-radius:10px;padding:16px;margin:1em 0;text-align:center;overflow-x:auto}
  .mermaid svg{max-width:100%;height:auto}
  #welcome{color:var(--muted)}
  #welcome h1{color:var(--text)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
  .cards a{display:block;padding:14px;border:1px solid var(--hairline);border-radius:12px;text-decoration:none;
    color:var(--text-dim);background:var(--panel)}
  .cards a:hover{border-color:var(--cyan-dim)}
  .cards a b{color:var(--text);display:block;margin-bottom:3px;font-size:14px}
  .err{color:var(--magenta);font-family:var(--font-mono);font-size:13px}
  @media(max-width:760px){
    body{grid-template-columns:1fr}
    aside{position:fixed;z-index:20;width:86%;max-width:340px;height:100%;transform:translateX(-100%);transition:transform .2s}
    body.nav-open aside{transform:none}
    .topbar .burger{display:inline-block}
  }
</style>
</head>
<body>
<aside id="rail">
  <div class="railhead">
    <div class="brand"><span class="dot"></span> Moxie&nbsp;Docs <small>explorer</small></div>
    <div class="fw" id="fw"></div>
    <div class="nav"><a href="hub.html">← hub</a><a href="./">simulator</a><a href="setup.html">setup</a><a href="cloud.html">console</a></div>
    <input id="q" type="search" placeholder="Search titles & headings…" autocomplete="off" spellcheck="false">
  </div>
  <nav class="tree" id="tree"></nav>
</aside>
<main id="main">
  <div class="topbar">
    <button class="burger" id="burger" aria-label="menu">☰</button>
    <span class="path" id="crumb">Select a document</span>
    <a class="src" id="src" href="#" target="_blank" rel="noopener">view source ↗</a>
  </div>
  <article id="content">
    <div id="welcome">
      <h1>📚 Moxie reverse-engineering docs</h1>
      <p>Every Markdown doc in the repo, browsable here with Mermaid diagrams rendered — no server, no
        install. Firmware under analysis: <code id="fw2"></code>.</p>
      <p class="muted">Pick a document on the left, or start with these:</p>
      <div class="cards" id="startcards"></div>
    </div>
  </article>
</main>

<script src="./vendor/marked.min.js"></script>
<script src="./vendor/mermaid.min.js"></script>
<script>
(function(){
  "use strict";
  var BUNDLE="docs-bundle/", idx=null, current=null, mmReady=false;
  var elTree=document.getElementById("tree"), elContent=document.getElementById("content"),
      elCrumb=document.getElementById("crumb"), elSrc=document.getElementById("src"),
      elQ=document.getElementById("q");

  try{ mermaid.initialize({startOnLoad:false, theme:"dark",
        themeVariables:{fontFamily:"Inter, sans-serif", darkMode:true,
          primaryColor:"#12202b", primaryBorderColor:"#0e7490", primaryTextColor:"#e8edf5",
          lineColor:"#5a6577", secondaryColor:"#161226", tertiaryColor:"#101018"}});
      mmReady=true;
  }catch(e){ /* mermaid optional */ }

  var esc=function(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});};

  // Prefix section labels for a clean tree.
  var SECTION_LABEL={ "reverse-engineering":"Reverse engineering", "architecture":"Architecture",
    "guides":"Guides", "design":"Design", "features":"Features", "_root":"Overview", "docs":"Docs" };

  function buildTree(filter){
    elTree.innerHTML="";
    var bySec={};
    idx.files.forEach(function(f){ (bySec[f.section]=bySec[f.section]||[]).push(f); });
    var order=Object.keys(bySec).sort(function(a,b){
      var pri={_root:0,"reverse-engineering":1,architecture:2,guides:3,features:4,design:5};
      return (pri[a]==null?9:pri[a])-(pri[b]==null?9:pri[b]) || a.localeCompare(b);
    });
    var shown=0;
    order.forEach(function(sec){
      var items=bySec[sec].filter(function(f){ return !filter || matches(f,filter); });
      if(!items.length) return;
      var h=document.createElement("div"); h.className="sec";
      h.textContent=SECTION_LABEL[sec]||sec; elTree.appendChild(h);
      items.forEach(function(f){
        var a=document.createElement("a"); a.className="doc"; a.href="#"+f.path;
        a.dataset.path=f.path;
        var label=f.title; 
        if(filter){ a.classList.add("hit"); label=highlight(f.title,filter); }
        a.innerHTML=label+'<span class="m">'+(f.mermaid?("◈"+f.mermaid+" "):"")+(f.bytes/1024|0)+'k</span>';
        a.onclick=function(ev){ ev.preventDefault(); open(f.path); if(window.innerWidth<=760) document.body.classList.remove("nav-open"); };
        elTree.appendChild(a); shown++;
      });
    });
    if(!shown){ elTree.innerHTML='<div class="sec">no matches</div>'; }
  }
  function matches(f,q){ q=q.toLowerCase();
    return f.title.toLowerCase().indexOf(q)>=0 || f.path.toLowerCase().indexOf(q)>=0 ||
           (f.headings||[]).some(function(h){return h.toLowerCase().indexOf(q)>=0;}); }
  function highlight(t,q){ var i=t.toLowerCase().indexOf(q.toLowerCase());
    return i<0?esc(t):esc(t.slice(0,i))+"<em>"+esc(t.slice(i,i+q.length))+"</em>"+esc(t.slice(i+q.length)); }

  function setActive(path){
    Array.prototype.forEach.call(elTree.querySelectorAll("a.doc"),function(a){
      a.classList.toggle("active", a.dataset.path===path); });
  }

  // Rewrite intra-doc relative links (../foo.md, ./bar.md) to explorer hashes.
  function fixLinks(root, fromPath){
    var baseDir=fromPath.indexOf("/")>=0?fromPath.replace(/\/[^/]*$/,""):"";
    Array.prototype.forEach.call(root.querySelectorAll("a[href]"),function(a){
      var href=a.getAttribute("href");
      if(/^(https?:|mailto:|#)/.test(href)) { if(/^https?:/.test(href)) a.target="_blank"; return; }
      // strip anchor
      var hash=""; var m=href.match(/#.*$/); if(m){ hash=m[0]; href=href.slice(0,m.index); }
      if(!href){ return; }
      if(!/\.md$/i.test(href)){ return; } // leave non-md relative links alone
      // resolve relative to baseDir
      var parts=(baseDir?baseDir.split("/"):[]);
      href.split("/").forEach(function(seg){
        if(seg===".."){ parts.pop(); } else if(seg==="."||seg===""){} else { parts.push(seg); }
      });
      var target=parts.join("/");
      // top-level README/ROADMAP live under _root/
      if(idx.files.some(function(f){return f.path===target;})){ a.setAttribute("href","#"+target); a.onclick=function(ev){ev.preventDefault();open(target);}; }
      else if(idx.files.some(function(f){return f.path==="_root/"+target;})){ a.onclick=function(ev){ev.preventDefault();open("_root/"+target);}; a.setAttribute("href","#_root/"+target); }
    });
  }

  function renderMermaid(root){
    if(!mmReady) return;
    var blocks=root.querySelectorAll("pre code.language-mermaid, code.language-mermaid");
    var jobs=[];
    Array.prototype.forEach.call(blocks,function(code,i){
      var pre=code.closest("pre")||code;
      var div=document.createElement("div"); div.className="mermaid";
      var id="mm-"+Date.now()+"-"+i;
      jobs.push(mermaid.render(id, code.textContent).then(function(r){ div.innerHTML=r.svg; })
        .catch(function(e){ div.innerHTML='<div class="err">mermaid: '+esc(e.message||e)+'</div>'; }));
      pre.replaceWith(div);
    });
  }

  function open(path){
    var f=idx.files.filter(function(x){return x.path===path;})[0];
    if(!f){ return; }
    current=path; setActive(path);
    try{ location.hash=path; }catch(e){}
    elCrumb.textContent=f.path.replace("_root/","");
    var srcRel = f.path.indexOf("_root/")===0 ? ("../../"+f.path.replace("_root/","")) : ("../../docs/"+f.path);
    elSrc.href=srcRel;
    elContent.innerHTML='<p class="muted">loading…</p>';
    fetch(BUNDLE+encodeURI(f.path)).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
      .then(function(md){
        elContent.innerHTML=marked.parse(md);
        fixLinks(elContent, f.path);
        renderMermaid(elContent);
        elContent.scrollIntoView({block:"start"}); document.getElementById("main").scrollTop=0;
      })
      .catch(function(e){ elContent.innerHTML='<p class="err">Could not load '+esc(f.path)+' — '+esc(e.message)+'</p>'; });
  }

  function startCards(){
    var picks=["reverse-engineering/FIELD-GUIDE.md","architecture/static-experience.md",
      "reverse-engineering/firmware-803-reference.md","reverse-engineering/qr-commands.md",
      "guides/revive-your-moxie.md","reverse-engineering/COVERAGE.md"];
    var el=document.getElementById("startcards"); if(!el) return;
    picks.forEach(function(p){ var f=idx.files.filter(function(x){return x.path===p;})[0]; if(!f) return;
      var a=document.createElement("a"); a.href="#"+p; a.innerHTML="<b>"+esc(f.title)+"</b><span>"+esc(f.section)+"</span>";
      a.onclick=function(ev){ev.preventDefault();open(p);}; el.appendChild(a); });
  }

  marked.setOptions({gfm:true, breaks:false, headerIds:true, mangle:false});
  fetch("docs-index.json").then(function(r){return r.json();}).then(function(d){
    idx=d;
    document.getElementById("fw").textContent=d.firmware;
    var fw2=document.getElementById("fw2"); if(fw2) fw2.textContent=d.firmware;
    buildTree(""); startCards();
    var initial=(location.hash||"").replace(/^#/,"");
    if(initial && idx.files.some(function(f){return f.path===initial;})) open(initial);
  }).catch(function(e){
    elTree.innerHTML='<div class="err" style="padding:12px">Could not load docs-index.json — run<br>'
      +'<code>python3 sim/tools/build_docs_bundle.py</code></div>';
  });

  var qt;
  elQ.addEventListener("input",function(){ clearTimeout(qt); qt=setTimeout(function(){ buildTree(elQ.value.trim()); },120); });
  document.getElementById("burger").onclick=function(){ document.body.classList.toggle("nav-open"); };
  window.addEventListener("hashchange",function(){ var h=(location.hash||"").replace(/^#/,""); if(h && h!==current) open(h); });
})();
</script>
</body>
</html>
