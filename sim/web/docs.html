<!DOCTYPE html>
<html lang="en">
<head>

<title>Moxie Docs — reverse-engineering explorer</title>
<meta name="description" content="Browse every Moxie reverse-engineering doc with Mermaid diagrams rendered — firmware, protocol, hardware, revival.">
<link rel="canonical" href="https://moxie.mattvalancy.com/docs.html">

<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<style>
  :root{
    --void:#060609; --bg:#08080e; --panel:#0f1119; --panel2:#0b0b12; --hairline:#242a36; --hairline2:#1a1f28;
    --text:#eef2f8; --text-dim:#cdd5e0; --muted:#8892a4; --dim:#5a6577;
    --cyan:#00f0ff; --cyan-dim:#0e7490; --teal:#12b5b0; --mint:#05ffa1; --amber:#fcee0a; --magenta:#ff2a6d; --purple:#a855f7;
    --font-ui:'Inter',system-ui,-apple-system,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
    --rail:320px;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;
    display:grid;grid-template-columns:var(--rail) 1fr;height:100vh;overflow:hidden}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#20262f;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#2c3542}

  /* ---- rail ---- */
  aside{background:linear-gradient(180deg,var(--panel),var(--panel2));border-right:1px solid var(--hairline);
    display:flex;flex-direction:column;min-height:0}
  .railhead{padding:14px 14px 12px;border-bottom:1px solid var(--hairline)}
  a.hubback{display:inline-flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none;font-size:12.5px;
    padding:5px 10px;border:1px solid var(--hairline);border-radius:8px;transition:.15s;margin-bottom:12px}
  a.hubback:hover{color:var(--cyan);border-color:var(--cyan-dim);background:#00f0ff0a}
  a.hubback svg{width:13px;height:13px}
  .brand{display:flex;align-items:center;gap:9px}
  .brand svg{width:26px;height:26px}
  .brand b{font-weight:640;font-size:15px}.brand small{color:var(--muted);font-weight:400}
  .fw{font-family:var(--font-mono);font-size:10.5px;color:var(--mint);margin-top:8px;letter-spacing:.3px}
  .searchwrap{position:relative;margin-top:11px}
  .searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--dim);fill:none;stroke-width:2}
  #q{width:100%;background:var(--void);border:1px solid var(--hairline);color:var(--text);border-radius:9px;
    padding:9px 10px 9px 32px;font-size:13px;font-family:inherit}
  #q:focus{outline:none;border-color:var(--cyan-dim);box-shadow:0 0 0 3px #0e749022}

  .tree{overflow-y:auto;padding:8px 8px 30px;flex:1;min-height:0}
  .grp{margin-bottom:2px}
  .grp>.gh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;cursor:pointer;
    color:var(--text-dim);font-family:inherit;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;
    padding:9px 8px 6px;text-align:left}
  .grp>.gh .caret{width:11px;height:11px;stroke:var(--dim);fill:none;stroke-width:2.4;transition:transform .18s;flex:none}
  .grp.open>.gh .caret{transform:rotate(90deg)}
  .grp>.gh .cnt{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;color:var(--dim);letter-spacing:0;
    background:#0a1016;border:1px solid var(--hairline2);border-radius:10px;padding:0 6px}
  .grp>.items{overflow:hidden;max-height:0;transition:max-height .22s ease}
  .grp.open>.items{max-height:2400px}
  a.doc{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 24px;border-radius:7px;color:var(--muted);
    text-decoration:none;font-size:13px;line-height:1.3;border-left:2px solid transparent}
  a.doc:hover{background:#161c26;color:var(--text-dim)}
  a.doc.active{background:#0d2029;border-left-color:var(--cyan);color:var(--cyan)}
  a.doc .dm{margin-left:auto;font-family:var(--font-mono);font-size:9px;color:var(--dim)}
  a.doc.hit em{color:var(--amber);font-style:normal}
  .snip{margin:-3px 0 5px 24px;padding:1px 10px 1px 13px;border-left:1px solid #22303c;
    font-family:var(--font-mono);font-size:10px;line-height:1.45;color:var(--dim);
    white-space:normal;overflow:hidden}
  .snip em{color:var(--amber);font-style:normal}
  .railfoot{border-top:1px solid var(--hairline);padding:11px 14px;font-size:11.5px;color:var(--dim)}
  .railfoot a{color:var(--muted);text-decoration:none}.railfoot a:hover{color:var(--cyan)}

  /* ---- content ---- */
  main{overflow-y:auto;min-height:0;scroll-behavior:smooth}
  .topbar{position:sticky;top:0;z-index:6;background:#08080ed9;backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline);padding:11px 30px;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
  .topbar .burger{display:none;background:none;border:1px solid var(--hairline);color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer}
  .topbar .path{font-family:var(--font-mono);color:var(--text-dim)}
  .topbar .path b{color:var(--cyan);font-weight:500}
  .topbar .actions{margin-left:auto;display:flex;gap:16px}
  .topbar a{color:var(--cyan-dim);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .topbar a:hover{color:var(--cyan)} .topbar a svg{width:13px;height:13px}

  .hero{position:relative;margin:0;padding:38px 30px 26px;border-bottom:1px solid var(--hairline2);
    background:radial-gradient(700px 300px at 78% 40%,#0e2230 0%,transparent 60%),linear-gradient(180deg,#0b0f14,transparent)}
  .hero .row{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:26px}
  .hero .txt{flex:1}
  .hero h1{font-size:30px;letter-spacing:-.6px;margin:0 0 8px}
  .hero p{color:var(--text-dim);margin:0;font-size:15px;max-width:560px}
  .hero .fwline{font-family:var(--font-mono);font-size:12px;color:var(--mint);margin-top:12px}
  .hero img{width:210px;height:auto;border-radius:16px;border:1px solid var(--hairline);
    box-shadow:0 18px 50px #000000aa;background:#080810}
  @media(max-width:760px){.hero img{display:none}}

  .docwrap{display:flex;gap:34px;max-width:1120px;margin:0 auto;align-items:flex-start}
  article{flex:1;min-width:0;max-width:820px;margin:0 auto;padding:30px 30px 90px;line-height:1.72;font-size:15.5px}
  .toc{position:sticky;top:74px;flex:none;width:210px;max-height:calc(100vh - 96px);overflow-y:auto;
    padding:26px 0 40px;font-size:12.5px}
  .toc .toc-h{font-family:var(--font-mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);
    padding:0 0 8px;border-bottom:1px solid var(--hairline2);margin-bottom:8px}
  .toc a{display:block;color:var(--muted);text-decoration:none;padding:4px 10px;border-left:2px solid transparent;
    line-height:1.35;transition:color .12s}
  .toc a.h3{padding-left:22px;font-size:12px;color:var(--dim)}
  .toc a:hover{color:var(--text-dim)}
  .toc a.active{color:var(--cyan);border-left-color:var(--cyan)}
  @media(max-width:1140px){.toc{display:none}}
  article>*:first-child{margin-top:0}
  article h1{font-size:28px;letter-spacing:-.4px;margin:1.4em 0 .5em;padding-bottom:.3em;border-bottom:1px solid var(--hairline)}
  article h2{font-size:22px;margin:1.7em 0 .6em;padding-bottom:.25em;border-bottom:1px solid var(--hairline2)}
  article h3{font-size:17.5px;margin:1.5em 0 .5em;color:var(--text)}
  article h4{font-size:15px;margin:1.3em 0 .35em;color:var(--text-dim)}
  article p,article li{color:var(--text-dim)}
  article li{margin:.28em 0}
  article a{color:var(--cyan);text-decoration:none;border-bottom:1px solid #0e749055}
  article a:hover{border-bottom-color:var(--cyan)}
  article code{font-family:var(--font-mono);font-size:.85em;background:#121722;border:1px solid var(--hairline);border-radius:5px;padding:.1em .38em;color:var(--mint)}
  article pre{background:#0b0e15;border:1px solid var(--hairline);border-radius:12px;padding:16px 18px;overflow-x:auto;margin:1.1em 0}
  article pre code{background:none;border:none;padding:0;color:#c6d2e0;font-size:12.5px;line-height:1.6}
  article table{border-collapse:collapse;margin:1.2em 0;font-size:13.5px;display:block;overflow-x:auto;max-width:100%}
  article th,article td{border:1px solid var(--hairline);padding:8px 12px;text-align:left;vertical-align:top}
  article th{background:#121722;color:var(--text);white-space:nowrap}
  article tbody tr:nth-child(even){background:#0d1017}
  article blockquote{border-left:3px solid var(--cyan-dim);margin:1.1em 0;padding:.5em 1.1em;background:#0b141a;border-radius:0 10px 10px 0;color:var(--muted)}
  article blockquote p{color:var(--muted)}
  article img{max-width:100%;border-radius:8px}
  article hr{border:none;border-top:1px solid var(--hairline2);margin:2.2em 0}
  /* syntax highlighting (highlight.js) — on-brand palette */
  .hljs{color:#c6d2e0;background:none}
  .hljs-comment,.hljs-quote{color:#5a6577;font-style:italic}
  .hljs-keyword,.hljs-selector-tag,.hljs-built_in,.hljs-name,.hljs-tag{color:#a855f7}
  .hljs-string,.hljs-title.class_,.hljs-doctag,.hljs-regexp{color:#05ffa1}
  .hljs-number,.hljs-literal,.hljs-symbol,.hljs-bullet{color:#fcee0a}
  .hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable{color:#00f0ff}
  .hljs-title,.hljs-title.function_,.hljs-section{color:#7fd0ff}
  .hljs-type,.hljs-class .hljs-title,.hljs-params{color:#12b5b0}
  .hljs-meta,.hljs-meta .hljs-keyword{color:#8892a4}
  .hljs-deletion{color:#ff2a6d}.hljs-addition{color:#05ffa1}
  .hljs-emphasis{font-style:italic}.hljs-strong{font-weight:600}
  .mermaid{background:#0b0e15;border:1px solid var(--hairline);border-radius:12px;padding:18px;margin:1.3em 0;text-align:center;overflow-x:auto}
  .mermaid svg{max-width:100%;height:auto}
  .pager{max-width:760px;margin:40px auto 0;display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--hairline2);padding-top:20px}
  .pager a{flex:1;text-decoration:none;color:var(--text-dim);border:1px solid var(--hairline);border-radius:11px;padding:12px 15px;font-size:13px;transition:.15s}
  .pager a:hover{border-color:var(--cyan-dim);color:var(--text)} .pager a.next{text-align:right}
  .pager a small{display:block;color:var(--dim);font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
  .docfoot{max-width:760px;margin:40px auto 0;text-align:center;font-size:12px;color:var(--dim);line-height:1.7}
  .docfoot a{color:var(--muted);text-decoration:none}.docfoot a:hover{color:var(--cyan)}
  .err{color:var(--magenta);font-family:var(--font-mono);font-size:13px}
  @media(max-width:760px){
    body{grid-template-columns:1fr}
    aside{position:fixed;z-index:30;width:88%;max-width:340px;height:100%;transform:translateX(-100%);transition:transform .22s;box-shadow:20px 0 60px #000a}
    body.nav-open aside{transform:none}
    .topbar .burger{display:inline-flex}
    .hero{padding:26px 20px 20px} article{padding:24px 20px 80px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important} main,html{scroll-behavior:auto}}
</style>
</head>
<body>
<aside id="rail">
  <div class="railhead">
    <a class="hubback" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Back to hub</a>
    <div class="brand">
      <svg viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#0e1620"/><path d="M50 22c-16 0-26 10-26 25 0 14 11 25 26 25s26-11 26-25c0-15-10-25-26-25z" fill="#12b5b0"/><ellipse cx="50" cy="49" rx="20" ry="18" fill="#f4feff"/><circle cx="43" cy="48" r="4.2" fill="#0a0a0f"/><circle cx="57" cy="48" r="4.2" fill="#0a0a0f"/><circle cx="44.4" cy="46.4" r="1.3" fill="#00f0ff"/><circle cx="58.4" cy="46.4" r="1.3" fill="#00f0ff"/></svg>
      <span style="display:flex;flex-direction:column;line-height:1.1"><b>Moxie Docs</b><small>reverse-engineering</small></span>
    </div>
    <div class="fw" id="fw"></div>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search all docs (full text)…" autocomplete="off" spellcheck="false">
    </div>
  </div>
  <nav class="tree" id="tree"></nav>
  <div class="railfoot">Created by <a href="https://mattvalancy.com" target="_blank" rel="noopener">Matthew Valancy</a> · <a href="https://github.com/mvalancy/moxie-robot-saver" target="_blank" rel="noopener">GitHub</a></div>
</aside>

<main id="main">
  <div class="topbar">
    <button class="burger" id="burger" aria-label="menu">☰ Docs</button>
    <span class="path" id="crumb">Overview</span>
    <span class="actions">
      <a id="src" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg> source</a>
    </span>
  </div>
  <div id="content"><article><p class="muted" style="padding:40px 30px">Loading docs…</p></article></div>
</main>

<script src="./vendor/marked.min.js"></script>
<script src="./vendor/mermaid.min.js"></script>
<script src="./vendor/highlight.min.js"></script>
<script>
(function(){
  "use strict";
  var BUNDLE="docs-bundle/", idx=null, current=null, mmReady=false, order=[];
  var SEARCH=null, searchLoading=false;
  function loadSearch(cb){
    if(SEARCH){ cb&&cb(); return; }
    if(searchLoading) return;
    searchLoading=true;
    fetch("docs-search.json").then(function(r){return r.json();}).then(function(j){
      SEARCH=j; searchLoading=false; cb&&cb();
    }).catch(function(){ searchLoading=false; });
  }
  var HOME="_root/README.md";
  var elTree=document.getElementById("tree"), elContent=document.getElementById("content"),
      elCrumb=document.getElementById("crumb"), elSrc=document.getElementById("src"), elQ=document.getElementById("q");
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;

  try{ mermaid.initialize({startOnLoad:false, theme:"dark", securityLevel:"loose",
    themeVariables:{fontFamily:"Inter, sans-serif", darkMode:true, background:"#0b0e15",
      primaryColor:"#0d2029", primaryBorderColor:"#0e7490", primaryTextColor:"#eef2f8",
      lineColor:"#5a6577", secondaryColor:"#161226", tertiaryColor:"#101018",
      clusterBkg:"#0b0e15", clusterBorder:"#242a36", edgeLabelBackground:"#0b0e15"}}); mmReady=true;
  }catch(e){}

  var esc=function(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});};
  var SECTION_LABEL={ "_root":"Start here","reverse-engineering":"Reverse engineering","architecture":"Architecture",
    "guides":"Guides","features":"Features","design":"Design","debugging":"Debugging","docs":"Reference" };
  var SECTION_ORDER={"_root":0,"guides":1,"architecture":2,"reverse-engineering":3,"debugging":4,"features":5,"design":6,"docs":7};

  function grouped(filter){
    var by={}; idx.files.forEach(function(f){ if(filter&&!matches(f,filter)) return; (by[f.section]=by[f.section]||[]).push(f); });
    return Object.keys(by).sort(function(a,b){ return (SECTION_ORDER[a]==null?9:SECTION_ORDER[a])-(SECTION_ORDER[b]==null?9:SECTION_ORDER[b])||a.localeCompare(b); })
      .map(function(s){ return {sec:s, items:by[s]}; });
  }
  function matches(f,q){ q=q.toLowerCase();
    if(f.title.toLowerCase().indexOf(q)>=0||f.path.toLowerCase().indexOf(q)>=0||(f.headings||[]).some(function(h){return h.toLowerCase().indexOf(q)>=0;})) return true;
    return !!(SEARCH && SEARCH[f.path] && SEARCH[f.path].toLowerCase().indexOf(q)>=0); }
  function snippetFor(f,q){
    if(!SEARCH||!q) return "";
    var body=SEARCH[f.path]; if(!body) return "";
    var lc=body.toLowerCase(), i=lc.indexOf(q.toLowerCase()); if(i<0) return "";
    var start=Math.max(0,i-42), end=Math.min(body.length,i+q.length+64);
    var seg=(start>0?"…":"")+body.slice(start,end)+(end<body.length?"…":"");
    return highlight(seg,q); }
  function highlight(t,q){ if(!q) return esc(t); var i=t.toLowerCase().indexOf(q.toLowerCase());
    return i<0?esc(t):esc(t.slice(0,i))+"<em>"+esc(t.slice(i,i+q.length))+"</em>"+esc(t.slice(i+q.length)); }

  var CARET='<svg class="caret" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  var ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  function buildTree(filter){
    elTree.innerHTML=""; order=[];
    var groups=grouped(filter), any=false;
    var activeSec=current?current.split("/")[0]:"_root";
    groups.forEach(function(g){
      if(!g.items.length) return; any=true;
      var wrap=document.createElement("div"); wrap.className="grp";
      var openIt = !!filter || g.sec===activeSec || g.sec==="_root";
      if(openIt) wrap.classList.add("open");
      var gh=document.createElement("button"); gh.className="gh";
      gh.innerHTML=CARET+'<span>'+(SECTION_LABEL[g.sec]||g.sec)+'</span><span class="cnt">'+g.items.length+'</span>';
      gh.onclick=function(){ wrap.classList.toggle("open"); };
      wrap.appendChild(gh);
      var items=document.createElement("div"); items.className="items";
      g.items.forEach(function(f){ order.push(f.path);
        var a=document.createElement("a"); a.className="doc"; a.href="#"+f.path; a.dataset.path=f.path;
        if(filter) a.classList.add("hit");
        a.innerHTML='<span>'+highlight(f.title,filter)+'</span>'+(f.mermaid?'<span class="dm">◈'+f.mermaid+'</span>':'');
        a.onclick=function(ev){ ev.preventDefault(); openDoc(f.path); if(window.innerWidth<=760) document.body.classList.remove("nav-open"); };
        items.appendChild(a);
        if(filter){ var sn=snippetFor(f,filter); if(sn){ var sd=document.createElement("div"); sd.className="snip"; sd.innerHTML=sn; sd.onclick=function(){ openDoc(f.path); if(window.innerWidth<=760) document.body.classList.remove("nav-open"); }; items.appendChild(sd); } } });
      wrap.appendChild(items); elTree.appendChild(wrap);
    });
    if(!any) elTree.innerHTML='<div class="grp"><div class="gh"><span>no matches</span></div></div>';
    setActive(current);
  }
  function setActive(path){ Array.prototype.forEach.call(elTree.querySelectorAll("a.doc"),function(a){ a.classList.toggle("active",a.dataset.path===path); }); }

  function fixLinks(root, fromPath){
    var baseDir=fromPath.indexOf("/")>=0?fromPath.replace(/\/[^/]*$/,""):"";
    Array.prototype.forEach.call(root.querySelectorAll("a[href]"),function(a){
      var href=a.getAttribute("href");
      if(/^(https?:|mailto:|#)/.test(href)){ if(/^https?:/.test(href)){a.target="_blank";a.rel="noopener";} return; }
      var hash=""; var m=href.match(/#.*$/); if(m){ hash=m[0]; href=href.slice(0,m.index); }
      if(!href||!/\.md$/i.test(href)) return;
      var parts=(baseDir?baseDir.split("/"):[]);
      href.split("/").forEach(function(seg){ if(seg===".."){parts.pop();} else if(seg==="."||seg===""){} else {parts.push(seg);} });
      var target=parts.join("/");
      var hit=idx.files.some(function(f){return f.path===target;})?target:(idx.files.some(function(f){return f.path==="_root/"+target;})?"_root/"+target:null);
      if(hit){ a.setAttribute("href","#"+hit); a.onclick=function(ev){ ev.preventDefault(); openDoc(hit); }; }
    });
  }
  var HLJS_ALIAS={proto:"protobuf",sh:"bash",shell:"bash",jsonc:"json",yml:"yaml",js:"javascript",py:"python"};
  var _hljsLangs=null;
  function highlightCode(root){
    if(typeof hljs==="undefined") return;
    if(!_hljsLangs){ try{ _hljsLangs={}; hljs.listLanguages().forEach(function(l){_hljsLangs[l]=1;}); }catch(e){ _hljsLangs={}; } }
    Array.prototype.forEach.call(root.querySelectorAll("pre code"),function(code){
      var cls=(code.className||"").match(/language-([A-Za-z0-9_+-]+)/);
      var lang=cls?cls[1].toLowerCase():null;
      if(lang==="mermaid") return;                       // handled separately
      if(lang){ lang=HLJS_ALIAS[lang]||lang;
        if(_hljsLangs[lang]){ code.className="language-"+lang;
          try{ hljs.highlightElement(code); }catch(e){} }
        // unknown language: leave as plain text (no console error)
      }
    });
  }

  function renderMermaid(root){
    if(!mmReady) return;
    var blocks=root.querySelectorAll("pre code.language-mermaid, code.language-mermaid");
    Array.prototype.forEach.call(blocks,function(code,i){
      var pre=code.closest("pre")||code, div=document.createElement("div"); div.className="mermaid";
      var id="mm-"+(current||"x").replace(/\W/g,"")+"-"+i;
      pre.replaceWith(div);
      mermaid.render(id, code.textContent).then(function(r){ div.innerHTML=r.svg; })
        .catch(function(e){ div.innerHTML='<div class="err">mermaid: '+esc(e.message||e)+'</div>'; });
    });
  }
  function heroHtml(){
    return '<div class="hero"><div class="row"><div class="txt">'+
      '<h1>Moxie Robot Saver</h1>'+
      '<p>An open, self-hostable revival of the Moxie robot. Everything below is the reverse-engineering that makes it possible — firmware, protocol, hardware, and the path to bring a robot back to life.</p>'+
      '<div class="fwline">firmware under analysis · '+esc(idx.firmware)+'</div>'+
      '</div><img src="img/hero-moxie-think.png" alt="The 3D Moxie simulator"></div></div>';
  }
  function pager(path){
    var i=order.indexOf(path); if(i<0) return "";
    var prev=i>0?order[i-1]:null, next=i<order.length-1?order[i+1]:null;
    function label(p){ var f=idx.files.filter(function(x){return x.path===p;})[0]; return f?esc(f.title):p; }
    var h='<div class="pager">';
    h+= prev?('<a href="#'+prev+'" data-go="'+prev+'"><small>Previous</small>'+label(prev)+'</a>'):'<span></span>';
    h+= next?('<a class="next" href="#'+next+'" data-go="'+next+'"><small>Next</small>'+label(next)+'</a>'):'<span></span>';
    return h+'</div>';
  }
  function footHtml(){
    return '<div class="docfoot">Created by <a href="https://mattvalancy.com" target="_blank" rel="noopener">Matthew Valancy</a> · '+
      '<a href="https://github.com/mvalancy/moxie-robot-saver" target="_blank" rel="noopener">moxie-robot-saver on GitHub</a><br>'+
      'Unofficial fan project — not affiliated with Embodied, Inc.</div>';
  }

  var _tocObs=null;
  function slug(t){ return t.toLowerCase().replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").slice(0,60)||"s"; }
  function buildTOC(art){
    var hs=art.querySelectorAll("h2, h3"); if(hs.length<2) return null;
    var nav=document.createElement("nav"); nav.className="toc";
    var seen={}, html='<div class="toc-h">On this page</div>';
    Array.prototype.forEach.call(hs,function(h){
      var id=slug(h.textContent); while(seen[id]){ id+="-x"; } seen[id]=1; h.id=id;
      html+='<a href="#'+id+'" class="'+h.tagName.toLowerCase()+'" data-id="'+id+'">'+esc(h.textContent)+'</a>';
    });
    nav.innerHTML=html;
    Array.prototype.forEach.call(nav.querySelectorAll("a"),function(a){
      a.onclick=function(ev){ ev.preventDefault(); var t=art.querySelector("#"+CSS.escape(a.dataset.id));
        if(t){ var main=document.getElementById("main"); main.scrollTo({top:t.offsetTop-60, behavior:reduce?"auto":"smooth"}); } };
    });
    return nav;
  }
  function spyTOC(art, toc){
    if(_tocObs){ _tocObs.disconnect(); _tocObs=null; }
    var links={}; Array.prototype.forEach.call(toc.querySelectorAll("a"),function(a){ links[a.dataset.id]=a; });
    var hs=art.querySelectorAll("h2, h3"); if(!("IntersectionObserver" in window)) return;
    var visible={};
    _tocObs=new IntersectionObserver(function(ents){
      ents.forEach(function(e){ if(e.isIntersecting) visible[e.target.id]=e.boundingClientRect.top; else delete visible[e.target.id]; });
      var top=null, best=1e9;
      Object.keys(visible).forEach(function(id){ if(visible[id]<best){ best=visible[id]; top=id; } });
      if(!top){ // none intersecting: pick the last heading above the fold
        var above=null; Array.prototype.forEach.call(hs,function(h){ if(h.getBoundingClientRect().top<120) above=h.id; }); top=above;
      }
      Object.keys(links).forEach(function(id){ links[id].classList.toggle("active", id===top); });
    },{root:document.getElementById("main"), rootMargin:"-56px 0px -70% 0px", threshold:0});
    Array.prototype.forEach.call(hs,function(h){ _tocObs.observe(h); });
  }

  function openDoc(path){
    var f=idx.files.filter(function(x){return x.path===path;})[0]; if(!f) return;
    current=path; try{ location.hash=path; }catch(e){}
    elCrumb.innerHTML=(SECTION_LABEL[f.section]||f.section)+' / <b>'+esc(f.title)+'</b>';
    var srcRel=f.path.indexOf("_root/")===0?("../../"+f.path.replace("_root/","")):("../../docs/"+f.path);
    elSrc.href=srcRel;
    // ensure the doc's section group is open + active
    var sec=path.split("/")[0];
    var grp=elTree.querySelector('a.doc[data-path="'+CSS.escape(path)+'"]');
    if(grp){ var g=grp.closest(".grp"); if(g) g.classList.add("open"); }
    setActive(path);
    fetch(BUNDLE+encodeURI(f.path)).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
      .then(function(md){
        var isHome=(path===HOME);
        var art=document.createElement("article"); art.innerHTML=marked.parse(md);
        fixLinks(art, f.path);
        // pager + footer
        var pg=document.createElement("div"); pg.innerHTML=pager(path)+footHtml();
        Array.prototype.forEach.call(pg.querySelectorAll("a[data-go]"),function(a){ a.onclick=function(ev){ ev.preventDefault(); openDoc(a.dataset.go); }; });
        elContent.innerHTML="";
        if(isHome) elContent.insertAdjacentHTML("beforeend", heroHtml());
        var toc=buildTOC(art);
        var wrap=document.createElement("div"); wrap.className="docwrap";
        wrap.appendChild(art); if(toc) wrap.appendChild(toc);
        elContent.appendChild(wrap);
        while(pg.firstChild) art.appendChild(pg.firstChild);
        highlightCode(art);
        renderMermaid(art);
        if(toc) spyTOC(art, toc);
        document.getElementById("main").scrollTop=0;
      })
      .catch(function(e){ elContent.innerHTML='<article><p class="err" style="padding:30px">Could not load '+esc(f.path)+' — '+esc(e.message)+'</p></article>'; });
  }

  marked.setOptions({gfm:true, breaks:false, headerIds:true, mangle:false});
  fetch("docs-index.json").then(function(r){return r.json();}).then(function(d){
    idx=d; document.getElementById("fw").textContent=d.firmware;
    var initial=(location.hash||"").replace(/^#/,"");
    current = (initial && idx.files.some(function(f){return f.path===initial;})) ? initial : HOME;
    if(!idx.files.some(function(f){return f.path===HOME;})) current=idx.files[0].path;
    buildTree(""); openDoc(current);
  }).catch(function(e){
    elTree.innerHTML='<div style="padding:14px" class="err">Could not load docs-index.json.<br>Run <code>python3 sim/tools/build_docs_bundle.py</code>.</div>';
  });

  var qt; elQ.addEventListener("input",function(){ clearTimeout(qt); qt=setTimeout(function(){ var v=elQ.value.trim(); if(v&&!SEARCH){ loadSearch(function(){ buildTree(elQ.value.trim()); }); } buildTree(v); },110); });
  document.getElementById("burger").onclick=function(){ document.body.classList.toggle("nav-open"); };
  window.addEventListener("hashchange",function(){ var h=(location.hash||"").replace(/^#/,""); if(h&&h!==current&&idx&&idx.files.some(function(f){return f.path===h;})) openDoc(h); });
})();
</script>
