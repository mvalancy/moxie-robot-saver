# Minimal anonymous broker for SIL/CI — no TLS. Ephemeral test use only.
# Production uses mqtt/broker/mosquitto.conf (TLS :8883).
listener 1883
allow_anonymous true
log_dest stdout
log_type all
connection_messages true
sys_interval 1

# WebSocket listener for the browser SIL UI (sim/web/) — MQTT-over-WS.
listener 9001
protocol websockets
allow_anonymous true
