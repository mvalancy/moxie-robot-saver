# nginx.conf — the `web` service's server block (sim/docker-compose.yml mounts it over the
# stock nginx:alpine default.conf). Stock behaviour plus ONE rule: a path with no extension
# is served as its `.html` page, the way Cloudflare Pages and sim/serve.py serve the site.
# The hub links `sim` (Pages answers `sim.html` with a 308 to /sim), and without this rule
# that link, the hero picture and the Simulator card were 404s on this stack.
# sim/test_env_hosted.mjs (block 9) reads this file.
server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
