# Moxie post-promotion ancestry monitor — INSTALL: copy to .github/workflows/promotion.yml
#
# Promotion PRs exist only for owner-approved major milestones. Squash-merging one leaves
# dev one commit behind main, so the next feature branch would start from stale ancestry.
# This hourly monitor catches that invisible cleanup miss after a measured 30-minute grace.
# It does not require or recreate a standing PR.
name: Promotion finished
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      grace_seconds:
        description: "Post-squash window to forgive, in seconds (0 = check right now)"
        type: string
        default: "1800"

permissions:
  contents: read

jobs:
  promotion:
    name: dev contains the latest main promotion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Was the last dev -> main promotion reconciled?
        env:
          # Keep untrusted dispatch input out of the shell program text.
          GRACE_SECONDS: ${{ inputs.grace_seconds || '1800' }}
        run: |
          python3 sim/tools/check_promotion_state.py --grace-seconds "$GRACE_SECONDS"
