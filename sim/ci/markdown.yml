name: Public Markdown parity
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix tools/markdown ci
      - run: npm --prefix tools/markdown test
