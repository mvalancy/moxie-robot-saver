# Moxie FAST CI (dev tier) — INSTALL: copy to .github/workflows/ci.yml
# Runs on push/PR to dev: quick feedback (docs guards + SIL smoke + unit tests).
# (pushing under .github/workflows/ needs a token with 'workflow' scope;
#  kept here as a template so it version-controls without that scope).
name: CI (fast · dev)
on:
  push: { branches: [dev] }
  pull_request: { branches: [dev] }

jobs:
  docs:
    name: Docs & protocol integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Internal doc links resolve
        run: python3 scripts/check-doc-links.py
      - name: Doc-tree consistency (no stale claims, version-stamped)
        run: python3 scripts/check-doc-consistency.py
      - name: Recovered protos compile
        run: |
          pip install protobuf grpcio-tools >/dev/null
          python3 tools/robot-toolkit/moxie_toolkit/validate_protos.py || true
      - name: Toolkit protocol round-trip tests (cloud.py / bus.py encoders vs the recovered protos)
        run: python3 tools/robot-toolkit/run_tests.py

  sil:
    name: SIL — virtual robot ⇄ server round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install broker + client deps
        run: |
          sudo apt-get update && sudo apt-get install -y mosquitto
          sudo systemctl stop mosquitto || true
          pip install "paho-mqtt>=2.0"
      - name: Hermetic pytest, EARLY (a red suite has to beat the merge gate)
        run: |
          # WHY THIS RUNS HERE and not only at the end of the job: the whole-suite step
          # below sits behind a ~3-minute browser install, so a plain unit-test failure
          # first reports ~4½ minutes into the job. On 2026-09-02 four PRs (#43–#46) were
          # merged 2m22s–2m28s after opening, while the only check that could fail had
          # not concluded — every one of them was red. The same tests, minus the ones
          # that need a broker or a browser, run here in ~15 s, inside that window.
          # protobuf is installed on purpose: the QR-parity step below installs it
          # anyway, and WITHOUT it the compiled-proto oracle silently `importorskip`s —
          # which is precisely the test that was red. Guarded by
          # sim/tests/test_ci_workflows.py.
          python3 -m pip install -q pytest openai jinja2 pyyaml protobuf httpx \
            -r server/requirements.txt
          python3 -m pytest sim/tests -q -k "not test_sil and not test_docs" \
            --ignore=sim/tests/test_live_gateway.py
      - name: Mode machine + honest indicator (Pages Functions imported under bare node)
        # Runs HERE, immediately after the hermetic pytest and long before anything
        # downloads a browser, for the same reason that step moved up: a red mode machine
        # has to report inside the window a merge gate actually waits. It needs no
        # Cloudflare account, no network and no browser — functions/api/*.js are ES
        # modules called with a plain object as context.env. Guarded by
        # sim/tests/test_ci_workflows.py.
        run: node sim/test_mode.mjs
      - name: Live-turn Pages Functions (proxy caps, tickets, WAV decode, ears, transport, fallback)
        # Runs HERE for the same reason test_mode.mjs does: these are the guards on the
        # routes that can SPEND MONEY and on the one control that keeps the gateway key out
        # of a response body, so a red one has to report inside the window a merge gate
        # actually waits. All six are hermetic — the Functions are imported as ES modules
        # with a plain object as context.env and a stubbed fetch, cloud-transport.js and
        # mic.js run on an injected clock (mic.js with a FAKE recorder — no test in this
        # repo may open a microphone), and no Cloudflare account or gateway key is needed
        # by any of them. Guarded by sim/tests/test_ci_workflows.py.
        run: |
          node sim/test_demo_proxy.mjs
          node sim/test_demo_tickets.mjs
          node sim/test_wav_decode.mjs
          node sim/test_demo_ears.mjs
          node sim/test_cloud_transport.mjs
          node sim/test_fallback_coverage.mjs
      - name: Run SIL smoke (state→config(paired)→remote-chat→reply)
        run: bash sim/run_smoke.sh
      - name: Bridge markup→avatar unit test
        run: node sim/test_bridge.mjs
      - name: Markup-floor render test (the 8 goldens through the real bridge)
        run: node sim/test_automarkup_render.mjs
      - name: Voice-loop tests (TTS/STT shapes; skips if services absent)
        run: node sim/test_voice.mjs
      - name: Cloud-TTS playback test (CloudTTSResponse decode + queue + lip-sync)
        run: node sim/test_audio.mjs
      - name: Revival-QR parity (browser encoder == python toolkit)
        run: |
          pip install protobuf
          node sim/test_qr.mjs
      - name: Cloud-console fixture + wiring test
        run: node sim/test_cloud.mjs
      - name: Build docs bundle for the explorer
        run: python3 sim/tools/build_docs_bundle.py
      - name: Docs bundle is fresh (committed bundle matches a rebuild of docs/)
        run: python3 sim/tools/check_bundle_fresh.py
      - name: Docs-explorer bundle + wiring test
        run: node sim/test_docs.mjs
      - name: Responsive UI test (skips cleanly if no browser is available)
        run: node sim/test_responsive.mjs
      - name: Hosted-deploy env test (no doomed backend probes; skips cleanly if no browser)
        run: node sim/test_env_hosted.mjs
      - name: Docs-explorer runtime test (Mermaid/search/highlight; skips cleanly if no browser)
        run: node sim/test_docs_explorer.mjs
      - name: Mermaid diagram render audit (no parse errors / clipped labels; skips cleanly if no browser)
        run: node sim/test_mermaid.mjs
      - name: Run SIL scenarios (scripted conversations)
        run: bash sim/run_scenarios.sh
      - name: SIL + static-site pytest/Playwright suite (all pages, resolutions, controls)
        run: |
          # This step runs the WHOLE sim/tests suite, so it needs the same hermetic test
          # deps as the deep tier (sim/ci/ci-deep.yml) — a dep only that tier installs is
          # a tier drift that shows up here as a red push, not as a caught bug.
          python3 -m pip install -q "paho-mqtt>=2.0" pytest openai jinja2 pyyaml playwright \
            httpx -r server/requirements.txt
          python3 -m playwright install --with-deps chromium
          python3 -m pytest sim/tests -q
