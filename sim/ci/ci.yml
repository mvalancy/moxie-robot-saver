# Moxie FAST CI (dev tier) — INSTALL: copy to .github/workflows/ci.yml
# Runs on push/PR to dev: quick feedback, in THREE PARALLEL JOBS —
#   docs     · doc-link/consistency guards + the toolkit's protocol round-trips (~1 min)
#   sil      · the broker-backed round-trip and the whole hermetic pytest suite
#   browser  · every suite that launches Chrome (see the block above the job)
# `browser` has no `needs:`, so the tier costs max(sil, browser), not their sum, and a
# Chrome suite can no longer contend with ~5,000 broker-backed pytest tests on one runner.
# All three are required by the merge gate — see scripts/pr-green.sh and the guard named
# in the `browser` job's comment.
# (pushing under .github/workflows/ needs a token with 'workflow' scope;
#  kept here as a template so it version-controls without that scope).
name: CI (fast · dev)
on:
  push: { branches: [dev] }
  pull_request: { branches: [dev] }

jobs:
  docs:
    name: Docs & protocol integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Internal doc links resolve
        run: python3 scripts/check-doc-links.py
      - name: Doc-tree consistency (no stale claims, version-stamped)
        run: python3 scripts/check-doc-consistency.py
      - name: Recovered protos compile
        run: |
          pip install protobuf grpcio-tools >/dev/null
          python3 tools/robot-toolkit/moxie_toolkit/validate_protos.py || true
      - name: Toolkit protocol round-trip tests (cloud.py / bus.py encoders vs the recovered protos)
        run: python3 tools/robot-toolkit/run_tests.py

  sil:
    name: SIL — virtual robot ⇄ server round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install broker + client deps
        run: |
          sudo apt-get update && sudo apt-get install -y mosquitto
          sudo systemctl stop mosquitto || true
          pip install "paho-mqtt>=2.0"
      - name: Hermetic pytest, EARLY (a red suite has to beat the merge gate)
        run: |
          # WHY THIS RUNS HERE and not only at the end of the job: the whole-suite step
          # below sits behind a ~3-minute browser install, so a plain unit-test failure
          # first reports ~4½ minutes into the job. On 2026-09-02 four PRs (#43–#46) were
          # merged 2m22s–2m28s after opening, while the only check that could fail had
          # not concluded — every one of them was red. The same tests, minus the ones
          # that need a broker or a browser, run here in ~15 s, inside that window.
          # protobuf is installed on purpose: the QR-parity step below installs it
          # anyway, and WITHOUT it the compiled-proto oracle silently `importorskip`s —
          # which is precisely the test that was red. Guarded by
          # sim/tests/test_ci_workflows.py.
          python3 -m pip install -q pytest openai jinja2 pyyaml protobuf httpx \
            -r server/requirements.txt
          python3 -m pytest sim/tests -q -k "not test_sil and not test_docs" \
            --ignore=sim/tests/test_live_gateway.py
      - name: Mode machine + honest indicator (Pages Functions imported under bare node)
        # Runs HERE, immediately after the hermetic pytest and long before anything
        # downloads a browser, for the same reason that step moved up: a red mode machine
        # has to report inside the window a merge gate actually waits. It needs no
        # Cloudflare account, no network and no browser — functions/api/*.js are ES
        # modules called with a plain object as context.env. Guarded by
        # sim/tests/test_ci_workflows.py.
        run: node sim/test_mode.mjs
      - name: Live-turn Pages Functions (proxy caps, tickets, WAV decode, ears, transport, fallback)
        # Runs HERE for the same reason test_mode.mjs does: these are the guards on the
        # routes that can SPEND MONEY and on the one control that keeps the gateway key out
        # of a response body, so a red one has to report inside the window a merge gate
        # actually waits. All six are hermetic — the Functions are imported as ES modules
        # with a plain object as context.env and a stubbed fetch, cloud-transport.js and
        # mic.js run on an injected clock (mic.js with a FAKE recorder — no test in this
        # repo may open a microphone), and no Cloudflare account or gateway key is needed
        # by any of them. Guarded by sim/tests/test_ci_workflows.py.
        run: |
          node sim/test_demo_proxy.mjs
          node sim/test_demo_tickets.mjs
          node sim/test_wav_decode.mjs
          node sim/test_demo_ears.mjs
          node sim/test_cloud_transport.mjs
          node sim/test_fallback_coverage.mjs
      - name: Run SIL smoke (state→config(paired)→remote-chat→reply)
        run: bash sim/run_smoke.sh
      - name: Bridge markup→avatar unit test
        run: node sim/test_bridge.mjs
      - name: 🎬 Action-payload parity (an `execute` is named identically by BOTH SIM clients)
        # DoD criterion 4's last open clause on this channel. PR #119 put `function_id` /
        # `function_args` / `action_args` on the wire and `bridge.js::applyAction` read
        # `entry.function` alone, so our own server's named `execute` rendered in the browser
        # as `(unnamed)` while `sim/virtual_moxie.py` named it. This drives the REAL bridge
        # over the same golden script the SIL robot is driven over
        # (sim/tests/goldens/cloud_to_robot_actions.json) and compares the decode entry by
        # entry — and it carries a NEGATIVE CONTROL: it reverts the fix in the bridge source
        # and requires the same comparison to go red, so it cannot pass vacuously. Node only,
        # no browser. Guarded by sim/tests/test_ci_test_coverage.py.
        run: node sim/test_action_payload.mjs
      - name: Markup-floor render test (the 8 goldens through the real bridge)
        run: node sim/test_automarkup_render.mjs
      - name: Behavior-planner render test (22 dialog acts through the real bridge)
        run: node sim/test_performance_render.mjs
      - name: Preview-render test (published remote_chat payloads through the real bridge)
        run: node sim/test_preview_render.mjs
      - name: Upload the behavior-planner contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: performance-contact-sheet
          path: sim/artifacts/performance-contact-sheet.html
          if-no-files-found: warn
      - name: Voice-loop tests (TTS/STT shapes; skips if services absent)
        run: node sim/test_voice.mjs
      - name: Cloud-TTS playback test (CloudTTSResponse decode + queue + lip-sync)
        run: node sim/test_audio.mjs
      - name: Revival-QR parity (browser encoder == python toolkit)
        run: |
          pip install protobuf
          node sim/test_qr.mjs
      - name: Cloud-console fixture + wiring test
        run: node sim/test_cloud.mjs
      - name: Build docs bundle for the explorer
        run: python3 sim/tools/build_docs_bundle.py
      - name: Docs bundle is fresh (committed bundle matches a rebuild of docs/)
        run: python3 sim/tools/check_bundle_fresh.py
      - name: CSP hashes match the pages (a stale hash BLANKS the live page)
        # `sim/web/_headers` pins a SHA-256 for the one inline <script> the site still has
        # (sim.html's importmap; the other thirteen became files on 2026-09-04). A static
        # `_headers` is only ever sent by Pages, so a hash that drifts from its block is
        # invisible to every other suite here and refuses the block IN PRODUCTION. This is
        # the generator's own --check; sim/tests/test_csp_hashes.py runs it again from
        # pytest and sim/test_csp.mjs asserts it a third time in a real browser.
        run: python3 sim/tools/build_csp_hashes.py --check
      - name: Docs-explorer bundle + wiring test
        run: node sim/test_docs.mjs
      - name: Run SIL scenarios (scripted conversations)
        run: bash sim/run_scenarios.sh
      - name: SIL + static-site pytest/Playwright suite (all pages, resolutions, controls)
        run: |
          # This step runs the WHOLE sim/tests suite, so it needs the same hermetic test
          # deps as the deep tier (sim/ci/ci-deep.yml) — a dep only that tier installs is
          # a tier drift that shows up here as a red push, not as a caught bug.
          python3 -m pip install -q "paho-mqtt>=2.0" pytest openai jinja2 pyyaml playwright \
            httpx -r server/requirements.txt
          python3 -m playwright install --with-deps chromium
          python3 -m pytest sim/tests -q

  # ─────────────────────────────────────────────────────────────────────────────
  # THE BROWSER SUITES — THEIR OWN JOB, IN PARALLEL WITH `sil`
  # ─────────────────────────────────────────────────────────────────────────────
  # WHY THEY LEFT `sil`. PR #120 fixed a real defect: `browser_harness.mjs::loadPuppeteer`
  # imports `puppeteer`, then falls back to scanning `~/Code/*/node_modules/puppeteer` — a
  # DEVELOPER-MACHINE path that cannot exist on a runner — and `skipper()` then called
  # `process.exit(0)`. No workflow installed puppeteer, so nine suites printed "skipped —
  # puppeteer not found" on every run and the job stayed GREEN. That silently deleted the
  # repo's best guards: `test_typed_turn.mjs` exists *because* PR #82 shipped 770 assertions
  # that all read a file while Web Audio was stubbed, and its peak-amplitude teeth had never
  # once fired here; nor had `test_mic_spend.mjs`, which counts `/api/chat` calls to prove a
  # refused microphone does not spend the gateway the owner's game shares. None of that is
  # undone here — every one of those suites still runs on every push and every PR.
  #
  # What #120 did NOT weigh is where it put them. `sil` already runs ~5,000 pytest tests
  # against a real mosquitto broker; eleven suites that each launch Chrome on top of that
  # took the job from ~7–8 min to ~17 min (runs 11:32:56 → 11:49:28), and the contention
  # started reddening UNRELATED tests: PR #125 is documentation-only and failed twice, on
  # two different SIL tests (`test_roster.py::…do_not_lose_each_others_robots`, "the roster
  # write was refused"; `test_schedule_sil_e2e.py::…is_pinned_and_says_so`, `AssertionError:
  # []`), both of which pass locally in under a second. A docs-only change cannot break
  # either — that is load contention on one runner, and a gate that goes red for reasons
  # unrelated to the change teaches people to re-run it rather than read it.
  #
  # So the browser tier is a SEPARATE JOB with NO `needs:` — it starts at the same moment
  # `sil` does, on its own runner, and the wall-clock for the fast tier is max(sil, browser)
  # instead of their sum. Nothing was deleted, weakened or exempted to buy that.
  #
  # THE MERGE GATE STILL REQUIRES IT. A job that cannot redden the gate is the same bug in a
  # new shape, so this is asserted, not assumed: `scripts/pr-green.sh` names the jobs it
  # requires in the rollup ("SIL" and "Browser"), and
  # `sim/tests/test_ci_workflows.py::test_the_merge_gate_requires_every_job_in_the_fast_tier`
  # fails if a fast-tier job's name is not one the gate names. Adding a fourth job without
  # teaching the gate about it reddens the suite.
  browser:
    name: Browser suites — headless Chrome (own runner, no needs:)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install a browser for the suites below (without one they would silently skip)
        # FIRST, and asserted to be first by sim/tests/test_ci_browser_suites_actually_run.py,
        # which checks it PER JOB: the original defect was an install step that existed and
        # sat ~40 lines after every browser step had already run and skipped. With two jobs
        # a file-wide ordering check would pass vacuously — one job's install "precedes"
        # another job's dispatch in byte order while doing nothing for it — so the guard now
        # resolves each dispatch to its own job and requires the install there.
        run: npm install --no-save --no-audit --no-fund puppeteer
      - name: Build docs bundle for the explorer
        # `test_docs_explorer.mjs`, `test_mermaid.mjs`, `test_csp.mjs` and
        # `test_responsive.mjs` all load `docs.html`, which reads `sim/web/docs-index.json`
        # and `sim/web/docs-bundle/**`. Those ARE committed, and `sil` proves the committed
        # copy matches a rebuild (`check_bundle_fresh.py`) — but this job must not depend on
        # a claim another job is still in the middle of checking, and passing an artefact
        # between jobs would re-serialise exactly what the split just parallelised. The
        # builder is stdlib-only and takes under a second, so this job simply rebuilds it.
        run: python3 sim/tools/build_docs_bundle.py
      - name: /api/* hardening headers, over a socket AND in a browser
        # MOVED WHOLE, not split. `sim/web/_headers` is INERT for a Pages Function (settled
        # by a preview deploy, §10 assumption 27): the only thing that puts HSTS, the
        # lockdown CSP and CORP on an /api/* reply is functions/api/_lib/envelope.js, and
        # nothing but this suite watches the wire. Its socket half is hermetic and could in
        # principle stay in `sil` — but the two halves share one ~250-line fixture (the real
        # route handlers behind a real node:http server, with `fetch` stubbed for the fake
        # gateway) and one exit code, and a second hand-copy of that fixture is precisely how
        # the three duplicated puppeteer blocks that `browser_harness.mjs` exists to replace
        # came about. Splitting it would also cost nothing it does not already cost: in `sil`
        # this step already ran AFTER the puppeteer install, so moving it here delays its
        # socket half by no more than it was delayed before. Guarded by
        # sim/tests/test_ci_test_coverage.py.
        run: node sim/test_api_headers.mjs
      - name: Responsive UI test (a missing browser FAILS here — see browser_harness.mjs)
        run: node sim/test_responsive.mjs
      - name: Hosted-deploy env test (no doomed backend probes)
        run: node sim/test_env_hosted.mjs
      - name: Typed-turn test (a typed line -> /api/chat -> real audio)
        # The Web Audio assertions are the reason this is a BROWSER step and not another
        # fake-DOM one: it reads the peak sample amplitude back out of the AudioBuffer the
        # browser was handed, so a silent clip cannot pass. It also asserts that clicking
        # the controls that cannot work on a hosted origin produces no CSP console error —
        # the defect it was written for. No gateway and no network: /api/* and the :8081
        # sidecar are answered at the browser. Guarded by sim/tests/test_ci_test_coverage.py.
        run: node sim/test_typed_turn.mjs
      - name: Phone-layout hit test (elementFromPoint on the bottom controls)
        # `#env-banner` sat exactly on top of `#rail-toggle` at phone widths and swallowed
        # every tap on it, while the toggle stayed visible, sized and pointer-events:auto —
        # so only a hit test could catch it. Includes a teeth block that restores the old
        # geometry and requires the collision to reappear.
        run: node sim/test_mobile_layout.mjs
      - name: Mic-spend test (a refused microphone must not buy a chat+speech turn)
        # The audit finding this closes: `mic.js` consoles a failed microphone with a
        # SCRIPTED CHILD LINE, and that line used to go out through `sendUserTurn` — so a
        # refused clip, or one refused client-side without ever being uploaded, bought a
        # full /api/chat + /api/speech on words nobody said. A claim about what the gateway
        # is BILLED for is a claim about requests that actually left a page, so this counts
        # them in Chrome, and pairs every "spends nothing" with a Web Audio assertion that
        # the visitor was still consoled out loud. Guarded by sim/tests/test_ci_test_coverage.py.
        run: node sim/test_mic_spend.mjs
      - name: Ambient self-talk must not cut off a live answer
        # WIRED HERE FOR THE FIRST TIME. It shipped with PR #124 deliberately unwired,
        # because the pass that wrote it could not touch `sim/ci/ci.yml` — a concurrent
        # pass held that file — and it has sat in `KNOWN_UNRUN` in
        # sim/tests/test_ci_test_coverage.py ever since, guarding the fix for ambient
        # chatter talking over a gateway answer (sim/web/ambient.js + audio.js) while being
        # executed by nobody. This job is that file's owner, so the exemption is now gone
        # from the ratchet and the suite runs on every push and every PR.
        run: node sim/test_ambient_guard.mjs
      # The accessibility suite, wired here for the same reason the ambient guard is: it
      # was written UNWIRED only because this job did not exist yet and its CI file was
      # held by another pass. That reason is gone, so parking it in KNOWN_UNRUN would now
      # be the very thing the ratchet exists to prevent — a suite that names itself as
      # "not run" and quietly stays that way. 63 checks, asserted against the real
      # accessibility tree by identity rather than by count.
      - name: Accessibility — the page's own a11y tree (names, live region, noscript)
        run: node sim/test_a11y.mjs
      - name: Security headers applied for real (CSP/HSTS from sim/web/_headers)
        # Every other browser suite serves the site with NO headers, so none of them could
        # see a policy that breaks the page — a CSP that refuses an inline block does not
        # degrade, it stops the page dead. This one parses the shipped _headers and loads
        # every page under it. Guarded by sim/tests/test_ci_test_coverage.py.
        run: node sim/test_csp.mjs
      - name: Docs-explorer runtime test (Mermaid/search/highlight)
        run: node sim/test_docs_explorer.mjs
      - name: Mermaid diagram render audit (no parse errors / clipped labels)
        run: node sim/test_mermaid.mjs
      - name: Background-effects growth test (a hidden tab must pile up nothing)
        # The owner-reported defect: leave the landing page open for hours and it turns
        # sluggish. bg.js filled `packets`/`pings` from two setIntervals and drained them
        # only inside the rAF frame — and a browser pauses rAF in a hidden tab while timers
        # keep firing, so a backgrounded page accumulated draw work with no consumer (0 ->
        # 44 packets in one minute, measured). This suite backgrounds a real tab, and its
        # teeth block rebuilds the old producer shape and requires the growth to reappear.
        # Guarded by sim/tests/test_ci_test_coverage.py.
        run: node sim/test_bg_perf.mjs
      - name: Parent console — 📈 Insights + the two-click Erase history button
        # THE FIRST BROWSER COVERAGE THE PARENT CONSOLE HAS EVER HAD. Until this step,
        # `grep -rln "server/static" sim/test_*.mjs` came back EMPTY: all ~28 headless
        # suites drove `sim/web` (the public simulator), so every console card — 📈
        # Insights, 📦 Content, 🧠 Brain, 🛡️ Safety, the robot list — was asserted only by
        # Python ROUTE tests, which cannot see whether a button in the page ever wires
        # itself up. PR #136 shipped the two-click-armed Erase history button and had to
        # report that no headless click had ever touched it.
        #
        # No fastapi and no supervisor: `serveStatic` serves `server/static` and every
        # `/local/*` XHR is answered at the browser, the idiom test_mic_spend.mjs uses for
        # `/api/*`. Fixtures come out of the REAL `server/moxie_server/fleet.py`
        # normalizers in a python3 subprocess (that module is dependency-free by design),
        # so the suite cannot pass against a response shape the route stopped sending.
        # Its teeth serve three MUTATED copies of app.js to Chrome and require the sweep to
        # redden — including the one the author's comment at app.js:337 predicted, where
        # the erase wiring works in some branches and not others.
        # Guarded by sim/tests/test_ci_test_coverage.py.
        run: node sim/test_console_insights.mjs
