# Moxie DEEP CI (main tier + HIL) — INSTALL: copy to .github/workflows/ci-deep.yml
# (needs a workflow-scoped token to push under .github/workflows/; see RELEASING.md).
# Runs on PRs INTO main (the promotion gate) + manual dispatch: the full suite, the
# packaged build, scenarios, and a hardware-in-the-loop stage — a virtual robot
# end-to-end now; a REAL robot + real gateway/voice via repo secrets + a self-hosted
# runner later.
name: CI (deep · main + HIL)
on:
  pull_request: { branches: [main] }
  workflow_dispatch:
    inputs:
      voice:
        description: "Also run the live VOICE tier (real Piper speech ⇄ real Whisper; downloads 2 × 63 MB voices)"
        type: boolean
        default: false

jobs:
  docs:
    name: Docs & protocol integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 scripts/check-doc-links.py
      - run: python3 scripts/check-doc-consistency.py
      - name: Recovered protos compile
        run: |
          pip install --quiet protobuf grpcio-tools
          python3 tools/robot-toolkit/run_tests.py

  package:
    name: Package builds (moxie-cloud-sdk sdist+wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build the SDK package
        run: |
          python -m pip install --quiet build
          cd mqtt && python -m build --outdir ../dist
      - uses: actions/upload-artifact@v4
        with: { name: moxie-cloud-sdk, path: dist/* }

  hil-sim:
    name: HIL — full end-to-end (virtual robot; real infra when secrets present)
    runs-on: ubuntu-latest
    # The live tiers below talk to a REAL gateway and (with voice=true) load two 63 MB
    # ONNX voices plus the Whisper weights on a CPU runner, so this job is the slow one.
    # A ceiling keeps a hung network call from burning an hour of runner time.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps (broker client + brain/test)
        run: |
          # Tier parity (playbook rule 9): the deep tier runs the SAME hermetic suite as
          # the fast tier, so it needs the SAME test deps — pyyaml (compose + workflow
          # guards) and the console's own requirements + httpx (the 55 console
          # round-trip tests) were missing here. Guarded by test_ci_workflows.py.
          pip install --quiet "paho-mqtt>=2.0" pytest openai jinja2 pyyaml httpx \
            -r server/requirements.txt
      - name: SIL smoke (state→config→remote-chat→reply)
        run: bash sim/run_smoke.sh
      - name: SIL scenarios (scripted conversations)
        run: bash sim/run_scenarios.sh
      # The connection rewrite (production-hardening.md §4.1) is the one thing no unit
      # test can prove: `retry_first_connection=True`, the CONNACK check, on_disconnect
      # and the eight `info.rc` publish sites all describe what happens when a REAL
      # broker goes away from a REAL supervisor process. This harness owns its own
      # mosquitto container so it can stop and start it, and asserts /status, the drop
      # counter and the console's 409 across the gap. Needs docker → deep tier only.
      - name: Broker outage (a real broker taken away from a running supervisor)
        run: bash sim/run_broker_outage.sh
      - name: Cloud SDK unit + integration tests
        run: python -m pytest sim/tests -q -k "not test_sil and not test_docs" --ignore=sim/tests/test_live_gateway.py
      # HIL against real infra: a live end-to-end turn through the runtime + gateway,
      # gated on repo secrets (never committed). Skips cleanly if unset. SECURITY: only
      # runs on SAME-REPO PRs / manual dispatch — GitHub withholds secrets from fork PRs,
      # and this guard makes that explicit so a fork PR can never reach the secret step.
      - name: Live gateway HIL turns (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}   # live gateway on-demand only (protects rate limits; also fork-safe)
        timeout-minutes: 15
        env:
          MOXIE_LLM_API_KEY: ${{ secrets.MOXIE_LLM_API_KEY }}
          MOXIE_LLM_BASE_URL: ${{ secrets.MOXIE_LLM_BASE_URL }}
          MOXIE_LLM_MODEL: ${{ secrets.MOXIE_LLM_MODEL }}
          MOXIE_VOICE_BASE_URL: ${{ secrets.MOXIE_VOICE_BASE_URL }}
          MOXIE_VOICE_MODEL: ${{ secrets.MOXIE_VOICE_MODEL }}       # optional; defaults to piper-amy
        run: |
          set -o pipefail
          # HONEST GATE. Every one of these files skips cleanly without a key — which is
          # right for the hermetic tier and wrong here: a dispatch whose secret is empty
          # would report a green "live" run that tested nothing. That silent-skip is the
          # exact DoD-6 gap this step exists to close, so an absent secret FAILS.
          if [ -z "$MOXIE_LLM_API_KEY" ]; then
            echo "::error::MOXIE_LLM_API_KEY is empty — set the repo secret; the live tier must not pass by skipping"
            exit 1
          fi
          # Same doctrine for the VOICE endpoint, which has been live since 2026-09-02:
          # a dispatch with no voice URL would skip test_live_gateway_tts and report green.
          if [ -z "$MOXIE_VOICE_BASE_URL" ]; then
            echo "::error::MOXIE_VOICE_BASE_URL is empty — the gateway voice is live; set the repo secret or the TTS proof passes by skipping"
            exit 1
          fi
          # test_live_gateway_tts transcribes the gateway's own audio back, so this tier
          # needs the ASR wheels (~1 min). The 63 MB Piper VOICES stay in the voice tier —
          # this suite makes the gateway do the speaking.
          pip install --quiet faster-whisper numpy
          # All the creds-only live suites in ONE invocation: the gateway/runtime turns,
          # the action-tag RATE check (does the shipped prompt still make the model emit
          # <exit>/<launch:…>), the shipped starter.json end-to-end on the wire, the
          # gateway VOICE (4 /audio/speech calls, transcribed back at overlap >= 0.7), and
          # the 🎚️ picker's DISCOVERY (1 /v1/models call — the listing is the picker's one
          # input we do not own, so a voice renamed on the gateway would otherwise turn
          # the console's default into "whatever is first" with nothing failing), the
          # gateway EARS, and the puppet's voice.
          #
          # test_live_gateway_stt and test_live_telehealth_voice were dispatched by NO tier
          # until 2026-09-03, while a status-log line claimed live STT coverage. Nothing
          # swept them in either: this step names FILES, so a `-k test_live_gateway`
          # substring never applied. STT went live the same day as TTS and got the same
          # claim but none of the enforcement — TTS even has a guard that fails when its
          # URL is empty, and STT had none. Neither needs a new secret: both fall back to
          # MOXIE_VOICE_BASE_URL / MOXIE_LLM_API_KEY, which this step already requires
          # above, and faster-whisper + numpy + paho are already installed in this job.
          # `-ra` so any skip is printed with its reason rather than hiding behind a dot.
          python -m pytest sim/tests/test_live_gateway.py \
                           sim/tests/test_live_action_tags.py \
                           sim/tests/test_live_content_e2e.py \
                           sim/tests/test_live_gateway_tts.py \
                           sim/tests/test_live_voice_picker.py \
                           sim/tests/test_live_gateway_stt.py \
                           sim/tests/test_live_telehealth_voice.py \
                           sim/tests/test_live_gateway_turn_e2e.py -q -ra -s | tee live-gateway.log
          {
            echo "### Live gateway tier (creds-only)"
            echo ""
            echo "Suites: \`test_live_gateway\` · \`test_live_action_tags\` · \`test_live_content_e2e\` · \`test_live_gateway_tts\` · \`test_live_voice_picker\` · \`test_live_gateway_stt\` · \`test_live_telehealth_voice\` · \`test_live_gateway_turn_e2e\`"
            echo ""
            echo '```'
            tail -n 1 live-gateway.log
            echo '```'
            echo ""
            echo "Skips (if any) — every line is a test that did **not** prove anything:"
            echo ""
            echo '```'
            grep '^SKIPPED' live-gateway.log || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- live VOICE tier: dispatch + `voice: true` ---------------------------------
      # Real speech in and out (sim/tests/test_live_talk_e2e.py). Needs piper-tts +
      # faster-whisper and the two Piper voices, which are git-ignored (63 MB each), so a
      # runner has neither — hence a separate opt-in input rather than always-on.
      # Same fork-safety guard as above: `workflow_dispatch` only.
      - name: Cache Piper voices (pinned rhasspy/piper-voices v1.0.0)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.voice }}
        uses: actions/cache@v4
        with:
          path: sim/tts/voices
          # Keyed on the pinned release + the exact voices, so a cache hit can only ever
          # be those bytes; the fetch below re-verifies sha256 regardless.
          key: piper-voices-rhasspy-v1.0.0-en_US-amy+lessac-medium
      - name: Cache Whisper weights (faster-whisper base.en downloads itself)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.voice }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-faster-whisper-base.en-${{ runner.os }}
      - name: Live VOICE HIL (real Piper speech ⇄ real Whisper)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.voice }}
        timeout-minutes: 30
        env:
          MOXIE_LLM_API_KEY: ${{ secrets.MOXIE_LLM_API_KEY }}
          MOXIE_LLM_BASE_URL: ${{ secrets.MOXIE_LLM_BASE_URL }}
          MOXIE_LLM_MODEL: ${{ secrets.MOXIE_LLM_MODEL }}
        run: |
          set -euo pipefail
          pip install --quiet piper-tts faster-whisper numpy
          # Pinned URLs + recorded sha256, idempotent on a warm actions/cache hit.
          python3 sim/ci/fetch_piper_voices.py
          python -m pytest sim/tests/test_live_talk_e2e.py -q -ra -s | tee live-voice.log
          # HONEST GATE, part two. This file `importorskip`s piper/faster-whisper/numpy and
          # skips wholesale when the voices are absent — so "0 passed, 4 skipped" is a
          # PASSING pytest run that proved nothing. Three of the four tests have no
          # legitimate reason to skip once the deps and voices are here (only the
          # live-brain one may, when the gateway degrades to its canned fallback), so
          # anything under three passes is a failure of this tier.
          # `|| true`: the case this gate exists for ("4 skipped", no "passed" at all)
          # makes grep exit 1, and `set -e` would kill the step before it could say why.
          passed=$(grep -oE '[0-9]+ passed' live-voice.log | tail -n 1 | cut -d' ' -f1 || true)
          passed=${passed:-0}
          {
            echo "### Live voice tier (\`voice: true\`)"
            echo ""
            echo '```'
            tail -n 1 live-voice.log
            echo '```'
            echo ""
            echo "Piper→Whisper measurements (\`[talk]\` lines):"
            echo ""
            echo '```'
            grep '^\[talk\]' live-voice.log || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -lt 3 ]; then
            echo "::error::live voice tier passed only ${passed} tests (need ≥3) — piper-tts / faster-whisper / numpy or the Piper voices did not load, so this tier skipped instead of proving the voice path"
            exit 1
          fi
      # Future: a `real-robot` job on a self-hosted runner wired to physical hardware
      # + the live gateway/voice, promoted from this virtual HIL stage.

  compose-stack:
    name: One-command stack (docker compose, end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # GitHub's ubuntu-latest runner ships Docker Engine + the compose plugin, so the
      # real repo-root stack can be built and proven here — no service containers, no
      # docker-in-docker shim. The smoke uses its own project name and ports (see
      # sim/compose-smoke.env), so it cannot collide with anything else on the runner.
      - name: Docker + compose available
        run: docker compose version
      - run: pip install --quiet "paho-mqtt>=2.0"
      - name: Compose smoke (build → up → virtual robot + TTS → /local/fleet → down -v)
        run: bash sim/run_compose_smoke.sh
      # The published-image path an owner actually installs: the same assertions against
      # docker-compose.images.yml, with the three images built locally under their GHCR
      # names and `pull_policy: never`, so this proves the wiring without a tag existing.
      - name: Compose smoke — PREBUILT-IMAGE mode (docker-compose.images.yml)
        env:
          MOXIE_SMOKE_MODE: images
        run: bash sim/run_compose_smoke.sh
      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -p moxie-smoke     --env-file sim/compose-smoke.env logs --tail 100 || true
          docker compose -p moxie-smoke-img --env-file sim/compose-smoke.env \
            -f docker-compose.images.yml logs --tail 100 || true

  # The release workflow pushes linux/amd64 + linux/arm64 on a v* tag. A broken arm64
  # build would only surface at release time, which is exactly the wrong moment — so the
  # promotion gate does the same multi-arch build WITHOUT pushing (no registry, no
  # credentials, nothing published).
  multi-arch-images:
    name: "Multi-arch build (no push): ${{ matrix.image }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: supervisor,   context: ./mqtt,        file: ./mqtt/Dockerfile }
          - { image: console,      context: .,             file: ./server/Dockerfile }
          - { image: broker-certs, context: ./mqtt/broker, file: ./mqtt/broker/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build for amd64 + arm64 (cache only — never pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
