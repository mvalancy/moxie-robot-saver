# Local Moxie MQTT broker — TLS on 8883, anonymous for the robot (the LAN-only model),
# hardened per docs/architecture/backlog/security-broker-auth.md §2 (P0): a `%c` ACL
# confines every anonymous client to its own device subtree, and the supervisor
# authenticates. **P0 is containment, not authentication.**
# Cert currently impersonates mqtt.googleapis.com (see keys/) to test faking Google IoT Core.
#
# Security is per listener because a real robot's MQTT password is an RS256 JWT: a
# password_file on 8883 would refuse it. Run gen-certs.sh, then gen-passwd.sh, to make
# keys/ and keys/passwd; both are git-ignored, per-appliance material.
per_listener_settings true

listener 8883
cafile   /mosquitto/config/keys/ca.crt
certfile /mosquitto/config/keys/mosquitto.crt
keyfile  /mosquitto/config/keys/mosquitto.key
tls_version tlsv1.2
allow_anonymous true
acl_file /mosquitto/config/acl-robot

log_dest stdout
log_dest topic
log_type all

listener 1883 127.0.0.1
allow_anonymous true
password_file /mosquitto/config/keys/passwd
acl_file /mosquitto/config/acl

# WebSocket listener for the browser UI (sim/web/) — MQTT-over-WS.
listener 9001
protocol websockets
allow_anonymous true
password_file /mosquitto/config/keys/passwd
acl_file /mosquitto/config/acl
