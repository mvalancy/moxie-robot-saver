# Local Moxie MQTT broker — TLS on 8883, anonymous (LAN-only model).
# Cert currently impersonates mqtt.googleapis.com (see keys/) to test faking Google IoT Core.
listener 8883
cafile   /mosquitto/config/keys/ca.crt
certfile /mosquitto/config/keys/mosquitto.crt
keyfile  /mosquitto/config/keys/mosquitto.key
tls_version tlsv1.2
allow_anonymous true
log_dest stdout
log_dest topic
log_type all
listener 1883 127.0.0.1
allow_anonymous true
