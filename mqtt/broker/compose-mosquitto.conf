# Broker config for the ONE-COMMAND STACK (the repo-root docker-compose.yml).
#
# Same trust model as mosquitto.conf (LAN-only, anonymous, TLS for the robot), with one
# deliberate difference: the plain listener binds every *container* interface instead of
# 127.0.0.1, because in compose the supervisor is a different container. The compose
# network is the boundary; port 1883 reaches the host only if you publish it (the stack
# does, for the SIM and the tests — bind it to 127.0.0.1 on an untrusted LAN).
#
# 8883 = the robot (TLS) · 1883 = supervisor/SIM/tests · 9001 = the browser UI over WS.

listener 8883
cafile   /mosquitto/config/keys/ca.crt
certfile /mosquitto/config/keys/mosquitto.crt
keyfile  /mosquitto/config/keys/mosquitto.key
tls_version tlsv1.2
allow_anonymous true

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

# The supervisor detects robot connect/disconnect by watching $SYS/broker/log, so the
# broker must republish its log to that topic (see supervisor/moxie_runtime.py).
log_dest stdout
log_dest topic
log_type all
connection_messages true
sys_interval 10

persistence true
persistence_location /mosquitto/data/
